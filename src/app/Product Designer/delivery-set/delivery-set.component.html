<div class="mainscreen">
  <!-- <h5 class="heading">Delivery Activities</h5> -->
  <div class="body">
    <div class="actionbox">
      <div class="actionitem">
        <mat-form-field appearance="outline">
          <mat-label>Filter</mat-label>
          <input matInput (keyup)="applyFilter($event)" #input autocomplete="off">
        </mat-form-field>
      </div>
      <div class="actionitem">
        <!-- <button class="queuebtn" mat-stroked-button (click)="viewQueue()">View Queue</button> -->
        <button class="addbtn" mat-stroked-button (click)="addDelivery()">Add Delivery Activities</button>
      </div>
    </div>
    <table mat-table [dataSource]="deliverySource" matSort>
      <!-- Delivery Name -->
      <ng-container matColumnDef="deliveryname">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Delivery Name</th>
        <td mat-cell *matCellDef="let row"> 
          <label [ngClass]="{'name': (row.type == 'Form' || row.type == 'Report')}" type="button" (click)="(row.type == 'Form' || row.type == 'Report') ? formpreview(row) : null">{{row.deliveryname}}</label>
          <label class="ischangeworkrequired" *ngIf="row['ischangeworkrequired']">(Changework Required)</label>
          <label class="ischangeworkrequired" style="color: red;" *ngIf="row['delete']">(Deleted)</label>
        </td>
      </ng-container>
  
      <!-- Delivery Type -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
        <td mat-cell *matCellDef="let row"> {{row.type}} </td>
      </ng-container>
  
      <!-- Action -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Edit</th>
        <td mat-cell *matCellDef="let row">
          <button class="editbtn" mat-icon-button type="button" (click)="editDelivery(row)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="deliveryColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: deliveryColumns;"></tr>
  
      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell emptytext" colspan="3">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[25, 50, 100]"></mat-paginator>
  </div>
</div>
