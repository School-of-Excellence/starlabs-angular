<div>
  <span class="d-flex flex-row justify-content-center mt-4"><h3>Create/Update Journey.</h3></span>
  <div class="mx-4 mt-4 d-flex flex-row">
     <mat-form-field class="w-25" appearance="outline">
        <mat-label>Filter By</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Enter journey name" #input>
    </mat-form-field>
    <button style="float: right; left: 53%;" mat-raised-button color="primary" (click)="updateOrder()">Update Order</button>
    <button style="float: right;left: 55%" mat-raised-button color="primary" (click)="addjourneydialog()">Add journey</button>
  </div>  
  <div class="mx-4 mt-2">
      <table mat-table [dataSource]="dataSource" matSort  cdkDropList 
      class="example-list" 
      (cdkDropListDropped)="drop($event)"
      [cdkDropListData]="dataSource.data"> 
        <ng-container matColumnDef="reoder">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ReOrder</th>
          <td mat-cell *matCellDef="let row">
            <button class="dragbtn" mat-icon-button cdkDragHandle>
              {{row["sequence"] != undefined ? (row["sequence"] + 1) : "N/A"}}<mat-icon>reorder</mat-icon>
            </button>
          </td> 
        </ng-container>  
        <!-- Journey  Column -->
        <ng-container matColumnDef="journey">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> List Of Journey</th>
          <td mat-cell *matCellDef="let row"> {{row.journey}} </td>
        </ng-container>

         <!-- AtcModel  Column -->
         <ng-container matColumnDef="atcmodel">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>AtcModel</th>
          <td mat-cell *matCellDef="let row"> {{row.atcmodel != undefined ? row.atcmodel :  null}} </td>
        </ng-container>
      
        <!-- Edit Column -->
        <ng-container matColumnDef="Edit">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Edit </th>
          <td mat-cell *matCellDef="let row"><button mat-mini-fab color="primary" type="button" (click)= "onrowedit(row.id)"><mat-icon> edit</mat-icon></button>  </td>
        </ng-container>
  
        <!-- Delete Column -->
        <!-- <ng-container matColumnDef="Delete">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Delete </th>
          <td mat-cell *matCellDef="let row"><button mat-mini-fab color="accent" type="button" (click)="onrowdelete(row.id)"><mat-icon>delete</mat-icon></button> </td>
        </ng-container> -->
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"  cdkDrag 
         [cdkDragData]="row"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[20, 40, 60, 100]"></mat-paginator>
    </div>
</div>
