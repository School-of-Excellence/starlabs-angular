<div class="mainscreen">
    <h5 class="heading">Journeys & Products Map</h5>
    <div class="body mat-elevation-z2">
      <div class="actionbox">
        <div class="actionitem">
          <!-- <mat-form-field>
            <mat-label>Filter</mat-label>
            <input matInput (keyup)="applyFilter($event.target.value)" #input autocomplete="off">
          </mat-form-field> -->
        </div>
        <div class="actionitem">
          <button class="addbtn" mat-stroked-button (click)="onopendialog()">Map Journey & Product</button>
        </div>
      </div>
      <table mat-table [dataSource]="journeyProductSource" matSort>
        <!-- Journey Name -->
        <ng-container matColumnDef="journey">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Journey</th>
          <td mat-cell *matCellDef="let row"> 
            {{mapJourney[row.journey]}}
          </td>
        </ng-container>
    
        <!-- Product Type -->
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Product Sequence</th>
          <td mat-cell *matCellDef="let row">
            <ul *ngIf="row.product != null">
              <li *ngFor="let sequence of row.product">
                {{mapProduct[sequence] != null ? mapProduct[sequence] : ''}}
              </li>
            </ul>
          </td>
        </ng-container>
    
        <!-- Action -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Edit</th>
          <td mat-cell *matCellDef="let row">
            <button class="editbtn" mat-icon-button type="button" (click)="onrowedit(row)">
              <mat-icon> edit</mat-icon>
            </button>
            </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="journeyProductHeading"></tr>
        <tr mat-row *matRowDef="let row; columns: journeyProductHeading;"></tr>
    
        <!-- Row shown when there is no matching data. -->
        <!-- <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell emptytext" colspan="3">No data matching the filter "{{input.value}}"</td>
        </tr> -->
      </table>
      <mat-paginator [pageSizeOptions]="[25, 50, 100]"></mat-paginator>
    </div>
</div>
