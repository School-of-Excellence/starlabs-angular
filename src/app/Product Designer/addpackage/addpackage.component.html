<div style="margin: 100px;">
    <div style="display: flex;flex-direction:row;justify-content:space-between;">
        <mat-form-field class="ml10" appearance="outline">
            <mat-label>Filter By</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Enter package name" #input>
        </mat-form-field>
        <button class="ml10" mat-raised-button color="primary" (click)="addpackagedialog()">Add Package</button>
    </div>
    <div >
        <table mat-table [dataSource]="dataSource" matSort>
      
          <!-- package  Column -->
          <ng-container matColumnDef="package">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> List Of Package</th>
            <td mat-cell *matCellDef="let row"> {{row.package}} </td>
          </ng-container>
  
          <!-- Edit Column -->
          <ng-container matColumnDef="Edit">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Edit </th>
            <td mat-cell *matCellDef="let row"><button mat-mini-fab color="primary" type="button" (click)= "onrowedit(row.id)"><mat-icon> edit</mat-icon></button>  </td>
          </ng-container>
    
          <!-- Delete Column -->
          <!-- <ng-container matColumnDef="Delete">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Delete </th>
            <td mat-cell *matCellDef="let row"><button mat-mini-fab color="accent" type="button" (click)="onrowdelete(row.id)"><mat-icon>delete</mat-icon></button> </td>
          </ng-container> -->
      
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      
          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
          </tr>
        </table>
      
        <mat-paginator [pageSizeOptions]="[20, 40, 60, 100]"></mat-paginator>
      </div>
  
  </div>
