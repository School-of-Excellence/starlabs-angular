<!-- label -->
<div class="d-flex flex-row justify-content-center mt-4 mb-2">
    <h4>View ATC Model</h4>
  </div>
  <div class="d-flex flex-row justify-content-end">
    <button class="mr-4" mat-stroked-button type="button" (click)="onOpenDialog()">Create ATC Model</button>
  </div>
  <div class="ml-4 mt-2 mr-4">
    <mat-form-field appearance="fill">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>
    
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource" matSort>
    
        <ng-container matColumnDef="atcmodel">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ATC Model </th>
          <td mat-cell *matCellDef="let row"> {{row.atcmodel}} </td>
        </ng-container>
    
        <ng-container matColumnDef="evolutiontype">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Evolution Type </th>
          <td mat-cell *matCellDef="let row"> {{row.evolutiontype}} </td>
        </ng-container>
    
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Category </th>
          <td mat-cell *matCellDef="let row">
            <span *ngFor="let item of row.category || []">{{item}}&nbsp;,&nbsp;&nbsp;</span>
          </td>
        </ng-container>
  
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Description </th>
          <td mat-cell *matCellDef="let row"> {{row.description}} </td>
        </ng-container>
  
        <ng-container matColumnDef="videourl">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Content Video </th>
          <td mat-cell *matCellDef="let row">
            <li *ngFor="let item of row.videourl">
              {{mapContentData[item.id]}}
            </li>
          </td>
        </ng-container>
    
        <ng-container matColumnDef="edit">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Edit </th>
          <td mat-cell *matCellDef="let row">
            <button type="button" mat-icon-button (click)="onEditDialog(row)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>
    
      <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
</div>
