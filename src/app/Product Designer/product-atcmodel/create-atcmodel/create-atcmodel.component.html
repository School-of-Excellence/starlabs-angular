<div class="mainscreen">
  <div class="d-flex flex-row justify-content-center mt-4 mb-2">
    <h4>Create ATC Model</h4>
  </div>
  <div>
    <form [formGroup]="form">

      <app-text
        label="ATC Model"
        controlName="atcmodel"
        [form]="form">
      </app-text>

      <app-auto-complete-with-chip
        label="Evolution Type"
        [form]="form"
        controlName="evolutiontype"
        [data]="['full','specialised']"
        datatype="arrayofstring"
        displayname=""
        valuetype=""
        valuelabel=""
        [multiple]="false">
      </app-auto-complete-with-chip>

      <app-mat-chip
        label="Category"
        controlName="category"
        [form]="form">
      </app-mat-chip>

      <app-text-area
        label="Description"
        controlName="description"
        [form]="form">
      </app-text-area>

      <app-text-area
        label="ATC Directive"
        controlName="directive"
        [form]="form">
      </app-text-area>

      <app-auto-complete-with-chip
        label="Video URL"
        [form]="form"
        controlName="videourl"
        [data]="contentData"
        datatype="arrayofmap"
        displayname="title"
        valuetype="ref"
        valuelabel="ref"
        [multiple]="true">
      </app-auto-complete-with-chip>

      <div style="display: flex; justify-content: center; align-items: center; margin-top: 16px;">
        <button mat-stroked-button type="button" (click)="dialogRef.close()">Cancel</button> &nbsp;&nbsp;&nbsp;
        <button mat-stroked-button type="button" (click)="onSubmit()" [disabled]="form.invalid">Submit</button>
      </div>

    </form>
  </div>
</div>
