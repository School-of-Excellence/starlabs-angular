<div class="mbq">

  <!-- Header -->
  <header class="mbq__head">
    <h2 class="mbq__title">Send {{ participantName }} back to queue</h2>
    <button type="button" class="mbq__close" (click)="cancel()" aria-label="Close">&#10005;</button>
  </header>

  <p class="mbq__sub">
    Session not complete. Returns the participant to the queue — the reason is visible to the Queue Manager.
  </p>

  <!-- Assignment choice -->
  <div class="mbq__options">
    <button type="button" class="mbq__opt" [class.mbq__opt--on]="result.preassign === true"
            (click)="result.preassign = true">
      <span class="mbq__radio"></span>
      <span class="mbq__opt-text">
        <span class="mbq__opt-title">Yes, pre-assign to my studio</span>
        <span class="mbq__opt-desc">You will do the {{ currentStage }} yourself next time.</span>
      </span>
    </button>

    <button type="button" class="mbq__opt" [class.mbq__opt--on]="result.preassign === false"
            (click)="result.preassign = false">
      <span class="mbq__radio"></span>
      <span class="mbq__opt-text">
        <span class="mbq__opt-title">No, do not assign</span>
        <span class="mbq__opt-desc">Any available specialist can handle it.</span>
      </span>
    </button>
  </div>

  <!-- Reason -->
  <textarea class="mbq__reason" rows="3" placeholder="Reason (required)..."
            [formControl]="reasonControl" (blur)="reasonControl.markAsTouched()"></textarea>
  <div class="mbq__err" *ngIf="reasonControl.touched && reasonControl.invalid">Reason is required.</div>

  <!-- Actions -->
  <footer class="mbq__foot">
    <button type="button" class="mbq__cancel" (click)="cancel()">Cancel</button>
    <button type="button" class="mbq__submit" [disabled]="reasonControl.invalid" (click)="onsubmit()">
      Submit move-back
    </button>
  </footer>

</div>
