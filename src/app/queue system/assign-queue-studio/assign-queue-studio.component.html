<div class="w-100" style="padding: 20px;">
    <h5 class="text-center m-2" style="font-size: 20px;">{{title}}</h5>
    <form [formGroup]="activityForm" (ngSubmit)="submit()">
      <mat-form-field *ngIf="activityForm.controls['selectedstudio'].enabled" class="w-100 mt-3" appearance="outline">
        <mat-label>Studio Specialist</mat-label>
        <mat-select formControlName="selectedstudio" data-testid="aqs-studio-select">
          <mat-option *ngFor="let option of studioList" [value]="option.value">{{option.name}}</mat-option>
        </mat-select>
        <mat-error *ngIf="activityForm.get('selectedstudio').hasError('required')">Required</mat-error>
      </mat-form-field>
      <br>
      <div formArrayName="bonusactivity">
        <div *ngFor="let field of bonusActivityForm().controls; let i = index" [formGroupName]="i">
          <mat-form-field class="inputfields me-3" appearance="outline">
            <mat-label>Activity</mat-label>
            <mat-select formControlName="activity">
              <mat-option *ngFor="let option of mapActivity | keyvalue" [value]="option.key">{{option.value}}</mat-option>
            </mat-select>
            <mat-error *ngIf="field.get('activity').hasError('required')">
              Required
            </mat-error>
          </mat-form-field>
          <mat-form-field class="inputfields me-3" appearance="outline">
            <mat-label>Specialist</mat-label>
            <mat-select formControlName="participants" multiple>
              <mat-option>
                <ngx-mat-select-search [(ngModel)]="filterText" [ngModelOptions]="{standalone: true}" [placeholderLabel]="'Search'" [noEntriesFoundLabel]="'No matching records found'" ngDefaultControl></ngx-mat-select-search>
              </mat-option>
              <mat-option *ngFor="let option of filterProfileList()" [value]="option.profileid">
                <span style="display:inline-flex;align-items:center;gap:8px;">
                  <app-profile-picture [profileId]="option.profileid" [name]="option.name" [size]="24"></app-profile-picture>
                  <span>{{option.name}}</span>
                </span>
              </mat-option>
            </mat-select>
            <mat-error *ngIf="field.get('participants').hasError('required')">
              Required
            </mat-error>
          </mat-form-field>
          <button mat-icon-button type="button" (click)="removeBonusArray(i)" *ngIf="!field.get('mandatory').value">
            <mat-icon>remove_circle_outline</mat-icon>
          </button>
          <span class="mandatory-tag" *ngIf="field.get('mandatory').value">Mandatory</span>
        </div>
      </div>
      <button mat-raised-button (click)="addBonusArray()">
        Add Other Specialists
      </button>
      <div class="w-100 text-center mt-4">
        <button mat-stroked-button class="cancelbtn me-3" type="button" (click)="dialogRef.close(null)">Close</button>
        <button mat-stroked-button class="submitbtn" type="submit" [disabled]="activityForm.invalid" data-testid="aqs-submit">Confirm Specialist</button>
      </div>
    </form>
</div>
