<div class="w-100" style="padding: 20px;">
    <h5 class="title">Confirmation!</h5>
    <span class="subtitle">Confirm that your session with this participant is finished and they should be moved to the next stage of the queue.</span>
    <div class="mt-3 text-center">
      <button class="cancelbtn me-3" mat-stroked-button (click)="cancel()">Cancel</button>
      <button class="successbtn" mat-stroked-button (click)="onSubmit()">Confirm</button>
    </div>
</div>
