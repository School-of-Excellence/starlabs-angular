<div class="w-100 text-center mb-3" style="padding: 20px;">
    <h5 class="fw-semibold mb-3 text-dark" style="font-size: 16px;">Audio Video Testing - {{typeof (token) === 'string' ? token : mapProfile[token["profile_id"]]['name']}}</h5>
    <mat-form-field class="textfield" appearance="outline">
      <mat-label>Zoom Meeting Link</mat-label>
      <input data-testid="avts-inp-1" matInput [(ngModel)]="zoomLink">
    </mat-form-field>
    <div class="w-100 mt-3">
      <button data-testid="avts-btn-2" class="cancelbtn me-3" mat-stroked-button (click)="close()">Close</button>
      <button data-testid="avts-btn-3" class="markbtn me-3" mat-stroked-button (click)="update('success')">Mark as Tested</button>
      <button data-testid="avts-btn-4" class="successbtn" mat-stroked-button (click)="update('invited')" [disabled]="zoomLink.trim().length == 0">Invite for AV Test</button>
    </div>
</div>
