<div class="mainscreen">
    <h5 class="heading">Zoom Account</h5>
    <div class="body mat-elevation-z2">
      <div class="actionbox">
        <div class="actionitem">
          <mat-form-field appearance="outline">
            <mat-label>Filter</mat-label>
            <input matInput #filter (keyup)="filterTable(filter.value)" #input autocomplete="off">
          </mat-form-field>
        </div>
        <div class="actionitem">
          <button class="addbtn" mat-stroked-button (click)="updateAccount(null)">Add New Zoom Account</button>
        </div>
      </div>
      <table mat-table [dataSource]="dataSource" matSort>
  
        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef>SNO</th>
          <td mat-cell *matCellDef="let row; let i = index">{{i + 1 + (paginator.pageIndex * paginator.pageSize)}}</td>
        </ng-container>
  
        <ng-container *ngFor="let element of displayedColumns.slice(1, displayedColumns.length - 2)" [matColumnDef]="element">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>{{element | uppercase}}</th>
          <td mat-cell *matCellDef="let row">{{row[element]}}</td>
        </ng-container>
  
        <ng-container matColumnDef="accounttype">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ACCOUNT TYPE</th>
          <td mat-cell *matCellDef="let row;">
            <mat-slide-toggle [checked]="row['accounttype'] == 'licensed'" (change)="onToggle($event, row)">Licensed</mat-slide-toggle>
          </td>
        </ng-container>
  
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row;">
            <button class="deletebtn" mat-icon-button type="button" (click)="updateAccount(row)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell emptytext" colspan="5">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[25, 50, 100]"></mat-paginator>
    </div>
  </div>
