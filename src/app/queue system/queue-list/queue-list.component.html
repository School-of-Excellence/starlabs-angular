<div class="mainscreen">
    <div class="body mat-elevation-z2">
      <div class="actionbox">
        <div class="actionitem">
          <mat-form-field appearance="outline">
            <mat-label>Filter</mat-label>
            <input matInput #filter (keyup)="applyFilter(filter.value)" #input autocomplete="off">
          </mat-form-field>
        </div>
        <div class="actionitem">
          <button class="queuebtn" mat-stroked-button (click)="createQueue(null)">Create Queue</button>
        </div>
      </div>
      <table mat-table [dataSource]="queueSource" matSort>
        <!-- Menu Column (first) -->
        <ng-container matColumnDef="menu">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button class="editbtn" mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="cloneQueue(row)">Clone Event</button>
              <button mat-menu-item (click)="inviteParticipant(row)">Invite Big Participant</button>
              <a mat-menu-item routerLink="/queuebigplanner" [queryParams]="{queueid: row['docid']}">
                <span>B!G Planner</span>
              </a>
            </mat-menu>
          </td>
        </ng-container>
        <!-- Delivery Name -->
        <ng-container matColumnDef="queuename">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Delivery Name</th>
          <td mat-cell *matCellDef="let row">{{row.queuename}}</td>
        </ng-container>
  
        <!-- Queue Date -->
        <ng-container matColumnDef="queuestartdate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Queue Date</th>
          <td mat-cell *matCellDef="let row">{{row.queuestartdate.toDate() | date:"mediumDate"}} to {{row.queueenddate.toDate() | date:"mediumDate"}}</td>
        </ng-container>
    
        <!-- Delivery Type -->
        <ng-container matColumnDef="stages">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
          <td mat-cell *matCellDef="let row">{{row.stages.join(', ')}} </td>
        </ng-container>
    
        <!-- Action -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Edit</th>
          <td mat-cell *matCellDef="let row">
            <button class="editbtn" mat-icon-button type="button" (click)="createQueue(row)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>
  
         <!-- Delete Flag -->
         <ng-container matColumnDef="delete">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Delete</th>
          <td mat-cell *matCellDef="let row">
            <mat-slide-toggle [checked]="row.delete != undefined ? row.delete : false" (change)="onDelete($event,row)">Soft Delete</mat-slide-toggle>
          </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="queueColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: queueColumns;"></tr>
    
        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell emptytext" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[25, 50, 100]"></mat-paginator>
    </div>
  </div>
