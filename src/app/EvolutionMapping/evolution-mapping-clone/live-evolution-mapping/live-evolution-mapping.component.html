<div *ngIf="loading" class="loading">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  </div>
<div *ngIf="!loading" style="padding: 20px;">
    <h4> {{mapProfile[profileid]}}'s Live Evolution Mapping</h4>
    <br>
    <div style="display: flex; align-items: center; gap: 20px;">
        <mat-form-field appearance="outline" class="flex-item" style="flex: 1;">
            <mat-label>Title</mat-label>
            <input matInput [(ngModel)]="title" placeholder="Enter a title">
        </mat-form-field>

        <mat-slide-toggle *ngIf="!isMake" [(ngModel)]="liveStatus" color="primary">
            Live
        </mat-slide-toggle>
    </div>
    <table mat-table [dataSource]="dataSource" matSort cdkDropList (cdkDropListDropped)="drop($event)">
        <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
            <td mat-cell *matCellDef="let element">
                {{mapVideoTitle[element]}}
            </td>
        </ng-container>
        <ng-container matColumnDef="videoUrl">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Video </th>
            <td mat-cell *matCellDef="let element"> 
                <div *ngIf="element">
                    <app-video-player [videoUrl]="element"></app-video-player>
                </div>
            </td>
        </ng-container>
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Delete </th>
            <td mat-cell *matCellDef="let element">
                <button mat-fab color="warn" (click)="deleteVideo(element)" matTooltip="delete" aria-label="delete icon">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" cdkDrag></tr>
    </table>
      
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
      <div style="display: flex; justify-content: center">
        <button (click)="makeLive()" [disabled]="disableButton" mat-raised-button class="custom-green-button"> <b>
            {{isMake ? 'Make Live' : 'Update'}}
        </b></button>&nbsp;&nbsp;&nbsp;
        <button (click)="closeDialog()" mat-raised-button color="warn" [disabled]="disableButton"> <b>close</b></button>
        </div>
    <!-- <button (click)="makeLive()" [disabled]="disableButton" mat-raised-button class="custom-green-button" style="width: 100%;"> <b>
    {{isMake ? 'Make Live' : 'Update'}}
    </b></button> -->
</div>
