
<div  style="margin: 20px;">
  <!-- <h5 class="title">Ei-Flix Workshop</h5> -->
  <div >
      <button type="button" style="float:right;color: green;" mat-stroked-button (click)="createWorkshop()"><mat-icon style="color:green;">edit_note</mat-icon> Add New Workshop </button>
  </div>
  <div class="mat-elevation-z8">
      <table mat-table [dataSource]="contentData" matSort>

        <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
            <td mat-cell *matCellDef="let row">{{row.title}}</td>
        </ng-container>

        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
            <td mat-cell *matCellDef="let row">{{row.description}}</td>
        </ng-container>

        <ng-container matColumnDef="startdate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Start Date </th>
            <td mat-cell *matCellDef="let row">{{row.startdate.toDate() | date }}
        </ng-container>

        <ng-container matColumnDef="enddate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> End Date </th>
            <td mat-cell *matCellDef="let row">{{row.enddate.toDate()  | date }}</td>
        </ng-container>

        <ng-container matColumnDef="lastregistrationdate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Registation Date </th>
            <td mat-cell *matCellDef="let row">{{row.lastregistrationdate.toDate() | date }}</td>
        </ng-container>

        <ng-container matColumnDef="edit">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> EDIT </th>
            <td mat-cell *matCellDef="let row">
                <button type="button" mat-icon-button class="edit" color="legacy" (click)="editContent(row)" ><mat-icon style="color:blue">edit_note</mat-icon></button>
            </td>
        </ng-container>

        <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> DELETE </th>
            <td mat-cell *matCellDef="let row">
                <button type="button" mat-icon-button class="delete" color="legacy" (click)="deleteContent(row)" ><mat-icon style="color:red;">delete</mat-icon></button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      </table>

      <mat-paginator [pageSizeOptions]="[25,50,100]" aria-label=""></mat-paginator>

  </div>

</div>
