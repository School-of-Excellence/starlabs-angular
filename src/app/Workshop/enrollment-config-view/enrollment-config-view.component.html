<main class="m-4">
  <!-- <h4 style="text-align: center;" class="mt-4">View Enrollment Layout</h4> -->
  <div class="d-flex flex-row justify-content-between m-4">
    <mat-form-field appearance="fill">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex.........." #input>
    </mat-form-field>
    <span>
      <button mat-raised-button style="color: green;" (click)="onOpenDialog()" type="button">Create Enrollemnt Page</button>
    </span>
  </div>
  <div class="mat-elevation-z8 m-4">
    <table mat-table [dataSource]="dataSource" matSort>
  
      <ng-container matColumnDef="label">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Label </th>
        <td mat-cell *matCellDef="let row"> {{row.label}} </td>
      </ng-container>
  
      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Edit </th>
        <td mat-cell *matCellDef="let row"> 
          <button mat-icon-button color="primary" type="button" (click)="onEditDialog(row)"><mat-icon>edit</mat-icon></button>
        </td>
      </ng-container>

      <ng-container matColumnDef="delete">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Delete </th>
        <td mat-cell *matCellDef="let row"> 
          <button mat-icon-button color="accent" type="button" (click)="onDeleteDoc(row)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [colSpan]="displayedColumns.length">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</main>
