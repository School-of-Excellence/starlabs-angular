<div *ngIf="loading">
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
</div>

<div class="mainscreen">
  <div class="heading">Utility</div>
  <div class="actionitem">
    <div>
      <mat-form-field appearance="outline">
        <mat-label>Search Table</mat-label>
        <input matInput #search (input)="filterTable(input.value)" #input autocomplete="off">
      </mat-form-field>
      <mat-form-field appearance="outline" class="datefield">
        <mat-label>Date Range</mat-label>
        <mat-date-range-input [rangePicker]="picker">
          <input matStartDate [(ngModel)]="startDate" (click)="picker.open()" placeholder="Start date">
          <input matEndDate [(ngModel)]="endDate" (click)="picker.open()" (dateChange)="showUtility()" placeholder="End date">
        </mat-date-range-input>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-date-range-picker #picker></mat-date-range-picker>
      </mat-form-field>
    </div>
    <div>
      <button class="exportbtn" mat-stroked-button (click)="exportCSV()">Export csv</button>
    </div>
  </div>
  <div #TABLE class="mat-elevation-z3">
    <table mat-table matSort [dataSource]="utilitySource" matSortActive="name">
      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Specialist</th>
        <td mat-cell *matCellDef="let element">
          <label>{{element.name}}</label>
        </td>
      </ng-container>
      <!-- Total Hours -->
      <ng-container matColumnDef="totalhours">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Availability Hours (Selected Date Range)</th>
        <td mat-cell *matCellDef="let element">
          <label>{{element.totalhours | number : '1.0-2'}}</label>
        </td>
      </ng-container>
      <!-- Consumed Hours -->
      <ng-container matColumnDef="consumedhours">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Consumed Hours (Selected Date Range)</th>
        <td mat-cell *matCellDef="let element">
          <label>{{element.consumedhours | number : '1.0-2'}}</label>
        </td>
      </ng-container>
      <!-- Utility -->
      <ng-container matColumnDef="utility">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Utilisation</th>
        <td mat-cell *matCellDef="let element">
          <label>{{element.utility}} {{" %"}}</label>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="utilityHeading"></tr>
      <tr mat-row *matRowDef="let row; columns: utilityHeading"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell emptytext" colspan="5">
          <label>No Data</label>
        </td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[25, 50, 100, 150]"></mat-paginator>
  </div>
</div>
