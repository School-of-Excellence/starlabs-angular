<div class="mainscreen">
  <h5 class="heading">Map Appointment Type & Delivery Roles</h5>
  <div class="body mat-elevation-z2">
    <div class="actionbox">
      <div class="actionitem">
        <mat-form-field>
          <mat-label>Filter</mat-label>
          <input matInput (keyup)="applyFilter($event)" #input autocomplete="off">
        </mat-form-field>
      </div>
      <div class="actionitem">
        <button class="addbtn" mat-stroked-button (click)="updateData(null)">Map Appointment Type & Delivery Roles</button>
      </div>
    </div>
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- EIS assigned appt.type Column -->
      <ng-container matColumnDef="appointment">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Appointment Types</th>
        <td mat-cell *matCellDef="let row"> {{row.appointment}}</td>
      </ng-container>
  
      <!-- EIS assigned_eis Column -->
      <ng-container matColumnDef="assignedrolelist">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Assigned Roles</th>
        <td mat-cell *matCellDef="let row"> {{row.assignedrolelist}}</td>
      </ng-container>

      <!-- Required Roles Column -->
      <ng-container matColumnDef="requiredrolelist">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Required Roles</th>
        <td mat-cell *matCellDef="let row"> {{row.requiredrolelist}}</td>
      </ng-container>

      <!-- Additional Role Column -->
      <ng-container matColumnDef="additionalrolelist">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Eligilble Roles</th>
        <td mat-cell *matCellDef="let row"> {{row.additionalrolelist}}</td>
      </ng-container>
  
      <!-- Edit Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button class="editbtn" mat-icon-button type="button" (click)="updateData(row)">
            <mat-icon> edit</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell emptytext" colspan="5">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[25, 50, 100]"></mat-paginator>
  </div>
</div>
