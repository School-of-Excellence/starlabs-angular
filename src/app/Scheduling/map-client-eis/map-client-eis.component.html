<div class="mainscreen">
  <div class="heading">EIS Mapping For Client Delivery Role</div>
  <div class="body mat-elevation-z2">
    <div class="actionbox">
      <div class="actionitem">
        <mat-form-field appearance="outline">
          <mat-label>Filter</mat-label>
          <input matInput (keyup)="applyFilter($event)" #input autocomplete="off">
        </mat-form-field>
      </div>
      <div class="actionitem">
        <button class="addbtn" mat-stroked-button (click)="updateData(null)">Map EIS For Client Delivery Role</button>
      </div>
    </div>
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- EIS client name  Column -->
      <ng-container matColumnDef="profilename">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>List Of Customer</th>
        <td mat-cell *matCellDef="let row">{{row.profilename}} </td>
      </ng-container>
  
      <!-- EIS assigned_eis  Column -->
      <ng-container matColumnDef="eisrole">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>List Of EIS</th>
        <td mat-cell *matCellDef="let row">
          <ul>
            <li *ngFor="let data of row.eisrole">{{data}}</li>
          </ul>
        </td>
      </ng-container>
    
      <!-- Edit Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let row">
          <button class="editbtn" mat-icon-button type="button" (click)="updateData(row)">
            <mat-icon> edit</mat-icon>
          </button>
          <button class="deletebtn" mat-icon-button type="button" (click)="clearRecord(row)">
            <mat-icon>delete</mat-icon>
          </button>
          </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell emptytext" colspan="3">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25, 100]"></mat-paginator>
  </div>
</div>
