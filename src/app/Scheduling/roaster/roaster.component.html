<div *ngIf="loading">
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
</div>

<div class="mainscreen">
  <div class="heading">Daily Roster</div>
  <div class="contentbox mat-elevation-z2">
    <div class="actionbox">
      <div class="actionitem">
        <mat-form-field appearance="outline">
          <mat-label>Search Appointment</mat-label>
          <input matInput #search (input)="applyAppointmentFilter($event)" #input autocomplete="off">
        </mat-form-field>
      </div>
      <div class="actionitem">
        <mat-form-field appearance="outline">
          <mat-label>Choose a date</mat-label>
          <input matInput [matDatepicker]="picker" [(ngModel)]="selectedDate" (dateChange)="onDateSelect()">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <button *ngIf="dateFilter" class="clearbtn" mat-stroked-button (click)="clearDate()">Clear</button>
        <button *ngIf="!dateFilter" class="allbtn" mat-stroked-button (click)="getAll()">Get All</button>
        <button class="exportbtn" mat-stroked-button (click)="exportCSV()">Export csv</button>
      </div>
    </div>
    <div #TABLE>
      <table mat-table matSort [dataSource]="appointmentSource">
        <!-- S No -->
        <ng-container matColumnDef="sno">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Serial No</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <label>{{i+1}}</label>
          </td>
        </ng-container>
        <!-- Product Name -->
        <ng-container matColumnDef="appointmentproduct">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Product Name</th>
          <td mat-cell *matCellDef="let element">
            <label>{{element.appointmentproduct}}</label>
          </td>
        </ng-container>
        <!-- Appointment Name -->
        <ng-container matColumnDef="appointmentname">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Service</th>
          <td mat-cell *matCellDef="let element">
            <label>{{element.appointmentname}} </label>
            <label *ngIf="element.attended" style="color: green;"> ✔</label>
            <!-- <label *ngIf="element.cancelled" style="color: red;"> ❌</label> -->
          </td>
        </ng-container>
        <!-- Slot Start Time -->
        <ng-container matColumnDef="starttime">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Scheduled Start Time</th>
          <td mat-cell *matCellDef="let element">
            <label>{{element.starttime | date:'shortTime'}}</label>
          </td>
        </ng-container>
        <!-- Client -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Client Name</th>
          <td mat-cell *matCellDef="let element">
            <label>{{element.name}}</label>
          </td>
        </ng-container>
        <!-- Host Data -->
        <ng-container matColumnDef="hosts">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Specialist</th>
          <td mat-cell *matCellDef="let element">
            <label class="linebreak">{{element.hosts}}</label>
          </td>
        </ng-container>
        <!-- Slot Start Time -->
        <ng-container matColumnDef="endtime">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Scheduled End Time</th>
          <td mat-cell *matCellDef="let element">
            <label>{{element.endtime | date:'shortTime'}}</label>
          </td>
        </ng-container>
        <!-- Date -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let element">
            <label>{{element.starttime | date:'mediumDate'}}</label>
          </td>
        </ng-container>
        <!-- Action -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let element">
            <button style="color: grey;" mat-icon-button (click)="resendEmail(element)">
              <mat-icon>email</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="appointmentHeader"></tr>
        <tr mat-row *matRowDef="let row; columns: appointmentHeader"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell emptytext" colspan="9">Upcoming Appointments Will Be Listed Here!</td>
        </tr>
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[25, 50, 100, appointmentSource.data.length]"></mat-paginator>
  </div>
</div>
