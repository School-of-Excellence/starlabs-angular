<div class="mainscreen">
  <div class="heading">EIS & Delivery Role Map</div>
  <div class="body mat-elevation-z2">
    <div class="actionbox">
      <div class="actionitem">
        <mat-form-field>
          <mat-label>Filter</mat-label>
          <input matInput (keyup)="applyFilter(input.value)" #input autocomplete="off">
        </mat-form-field>
      </div>
      <div class="actionitem">
        <button class="addbtn" mat-stroked-button (click)="updateData(null)">Map EIS & Delivery Role</button>
      </div>
    </div>
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- EIS assigned role  Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>List Of Roles</th>
        <td mat-cell *matCellDef="let row"> {{row.role}} </td>
      </ng-container>
  
      <!-- EIS assigned_eis  Column -->
      <ng-container matColumnDef="eis">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>List Of EIS</th>
        <td mat-cell *matCellDef="let row">
          <label>{{row.eis}}</label>
        </td>
      </ng-container>
  
      <!-- Edit Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Edit </th>
        <td mat-cell *matCellDef="let row">
          <button class="editbtn" mat-icon-button type="button" (click)="updateData(row)">
            <mat-icon> edit</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell emptytext" colspan="3">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[25, 50, 100]"></mat-paginator>
  </div>
</div>
