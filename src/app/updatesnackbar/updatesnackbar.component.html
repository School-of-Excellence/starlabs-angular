<div
  class="update-snackbar-container"
  (pointerdown)="onDragStart($event)"
  (pointermove)="onDragMove($event)"
  (pointerup)="onDragEnd($event)"
  (pointercancel)="onDragEnd($event)">
    <span class="update-dot"></span>
    <span class="update-message">Update available</span>
    <button data-testid="usb-update"
      mat-raised-button
      class="update-btn"
      (click)="update()">
      <mat-icon>refresh</mat-icon>
      Reload
    </button>
</div>
