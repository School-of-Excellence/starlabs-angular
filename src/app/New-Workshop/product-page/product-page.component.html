<mat-tab-group>
  <mat-tab label="Products">
  <div style="padding: 20px;">
  <div class="header">
    <h2>Products</h2>
    <mat-form-field appearance="outline" class="search-box">
      <mat-label>Search</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search products..." />
    </mat-form-field>

    <button mat-flat-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      Add Product
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 full-width" cdkDropList (cdkDropListDropped)="drop($event)">
    <!-- Drag handle column -->
    <ng-container matColumnDef="drag">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row" cdkDragHandle style="cursor: move; display: flex; align-items: center; justify-content: center; margin-top: 18px;">
        <mat-icon>drag_indicator</mat-icon>
      </td>
    </ng-container>

    <ng-container matColumnDef="productname">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Product </th>
      <td mat-cell *matCellDef="let p"> {{ p.productname }} </td>
    </ng-container>

    <ng-container matColumnDef="shortdescription">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Short Description </th>
      <td mat-cell *matCellDef="let p"> {{ p.shortdescription }} </td>
    </ng-container>

    <ng-container matColumnDef="claimlink">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Claim Link </th>
      <td mat-cell *matCellDef="let p">
        <a [href]="p.claimlink" target="_blank">Open</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="buttonname">
  <th mat-header-cell *matHeaderCellDef> Button Name </th>
  <td mat-cell *matCellDef="let p"> {{ p.buttonname }} </td>
</ng-container>


    <ng-container matColumnDef="productimage">
      <th mat-header-cell *matHeaderCellDef> Image </th>
      <td mat-cell *matCellDef="let p">
        <img [src]="p.productimage" width="60" height="60" *ngIf="p.productimage" />
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let p; let i = index">
        <button mat-icon-button color="primary" (click)="openEditDialog(p, i)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteProduct(i)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" cdkDrag></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>


  </mat-tab>
  <mat-tab label="Enquiries">
    <div style="padding: 20px;">
    </div>
  </mat-tab>

</mat-tab-group>
