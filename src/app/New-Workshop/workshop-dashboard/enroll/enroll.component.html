<div style="padding: 20px; max-width: 400px;">
  <h2 mat-dialog-title>Enroll Participant</h2>

  <div *ngIf="isLoading" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 30px 0;">
    <mat-spinner [diameter]="40"></mat-spinner>
    <span>Loading participants...</span>
  </div>

  <ng-container *ngIf="!isLoading">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Select Participants</mat-label>
    <mat-select [formControl]="nameControl" multiple>
      <mat-option *ngFor="let profile of profilestoenroll" [value]="profile">
        {{ mapProfile[profile] }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-chip-listbox aria-label="Selected Participants" style="margin-bottom: 10px;">
    <mat-chip *ngFor="let profile of nameControl.value"
              [removable]="true"
              (removed)="removeProfile(profile)">
      {{ mapProfile[profile] }}
      <mat-icon matChipRemove>cancel</mat-icon>
    </mat-chip>
  </mat-chip-listbox>

  <div style="display: flex; gap: 10px; margin-top: 10px;">
    <button
      mat-raised-button
      color="primary"
      (click)="Enroll()"
      style="flex: 1;">
      Enroll
    </button>

    <button
      mat-button
      (click)="cancel()"
      style="flex: 1;">
      Cancel
    </button>
  </div>
  </ng-container>
</div>
