<div class="dialog-wrapper">
  <h2 mat-dialog-title class="dialog-title">Referral Code</h2>

  <mat-dialog-content class="dialog-content">
    <div *ngIf="isLoading" class="loading-row">
      <mat-spinner diameter="24"></mat-spinner>
      <span>Loading...</span>
    </div>

    <mat-form-field *ngIf="!isLoading" appearance="outline" class="full-width">
      <mat-label>Referral Code</mat-label>
      <input
        matInput
        [formControl]="referralCodeControl"
        (input)="onInput($event)"
        placeholder="ENTER CODE"
        maxlength="32"
        autocomplete="off">
      <mat-error *ngIf="referralCodeControl.hasError('required')">
        Referral code is required
      </mat-error>
      <mat-error *ngIf="referralCodeControl.hasError('pattern')">
        Only uppercase letters and numbers are allowed
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="close()">Close</button>
    <button
      mat-raised-button
      color="primary"
      (click)="update()"
      [disabled]="referralCodeControl.invalid || isLoading">
      Update
    </button>
  </mat-dialog-actions>
</div>
