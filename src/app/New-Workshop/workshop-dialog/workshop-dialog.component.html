<div class="dialog-wrapper">
  <h2 mat-dialog-title class="dialog-title">Referral Code</h2>

  <mat-dialog-content class="dialog-content">

    <div *ngIf="isLoading" class="loading-row">
      <mat-spinner diameter="24"></mat-spinner>
      <span>Loading...</span>
    </div>

    <ng-container *ngIf="!isLoading">

      <div class="new-code-wrapper">
        <mat-form-field appearance="outline" class="new-code-field">
          <mat-label>ENTER NEW CODE</mat-label>
          <input
            matInput
            [formControl]="createCodeControl"
            (input)="onCreateInput($event)"
            maxlength="32"
            autocomplete="off" />
          <mat-error *ngIf="createCodeControl.hasError('minlength')">
            At least 2 char
          </mat-error>
          <mat-error *ngIf="createCodeControl.hasError('pattern')">
            Only uppercase letters and numbers allowed
          </mat-error>
        </mat-form-field>
        <button
          mat-raised-button
          color="primary"
          class="save-code-btn"
          (click)="saveCode()"
          [disabled]="!createCodeControl.value || createCodeControl.invalid">
          Save Code
        </button>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Select Referral Code</mat-label>
        <mat-select [formControl]="referralCodeControl">
          <mat-option value="" disabled>— Select a code —</mat-option>
          <mat-option *ngFor="let code of savedCodes" [value]="code">
            {{ code }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="referralCodeControl.hasError('required')">
          Please select a referral code
        </mat-error>
      </mat-form-field>

    </ng-container>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="close()">Close</button>
    <button
      mat-raised-button
      color="primary"
      (click)="update()"
      [disabled]="referralCodeControl.invalid || isLoading">
      Update
    </button>
  </mat-dialog-actions>

</div>
