<div class="m-4">
  <h5 class="heading">Edit Remark</h5>
  <div *ngFor="let list of remark">
    <textarea  class="textareafield" rows="5" cols="60" [(ngModel)]="list.note"></textarea>
  </div>
  <div class="btnbox">
    <button data-testid="rmd-cancel-1" mat-stroked-button class="cancelbtn" (click)="cancel()">Cancel</button>
    <button data-testid="rmd-submit-2" mat-stroked-button class="submitbtn" (click)="submit()">Submit</button>
  </div>
</div>
