<div class="dialog-overlay">
  <div class="dialog-container">

    <!-- Header -->
    <div class="dialog-header">
      <div class="header-content">
        <div class="icon-wrapper">
          <i class="fas fa-list-alt"></i>
        </div>
        <div>
          <h2>Manage Lists</h2>
          <p class="subtitle">Create new lists or merge with existing ones</p>
        </div>
      </div>
      <button class="close-btn" mat-dialog-close (click)="dialogRef.close()" aria-label="Close dialog">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Content -->
    <div class="dialog-content">
      
      <!-- Add New List Section -->
      <div class="section-card">
        <div class="section-header">
          <i class="fas fa-plus-circle"></i>
          <h3>Create New List</h3>
        </div>
        <div class="form-section">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>List name</mat-label>
            <input 
              matInput 
              placeholder="Enter list name..." 
              [(ngModel)]="newList"
              (keyup.enter)="newList && addList()" />
            <mat-icon matSuffix class="input-icon">edit</mat-icon>
          </mat-form-field>
          <button 
            mat-flat-button 
            color="primary" 
            (click)="addList()" 
            [disabled]="!newList"
            class="add-btn">
            <i class="fas fa-plus"></i>
            <span>Add List</span>
          </button>
        </div>
      </div>

      <!-- Existing Lists Section -->
      <div class="section-card">
        <div class="section-header">
          <h3>Existing List</h3>
          <span class="list-count" *ngIf="listData">{{ listData.length }} lists</span>
        </div>
        
        <div class="lists-wrapper">
          <div *ngIf="listData as lists; else loading">
            <div class="empty-state" *ngIf="lists.length === 0">
              <i class="fas fa-inbox"></i>
              <p>No lists available</p>
              <small>Create your first list above</small>
            </div>
            
            <div class="list-items" *ngIf="lists.length > 0">
              <div 
                class="list-item" 
                *ngFor="let list of lists; let i = index"
                [class.selected]="selectedListId === list.docid"
                (click)="selectedListId = list.docid">
                <mat-checkbox
                  [checked]="selectedListId === list.docid"
                  (change)="selectedListId = list.docid"
                  (click)="$event.stopPropagation()">
                </mat-checkbox>
                <div class="list-info">
                  <span class="list-name">{{ list.listname }}</span>
                </div>
                <div class="list-indicator">
                  <i class="fas fa-check-circle" *ngIf="selectedListId === list.docid"></i>
                </div>
              </div>
            </div>
          </div>

          <ng-template #loading>
            <div class="loading-state">
              <div class="spinner"></div>
              <p>Loading lists...</p>
            </div>
          </ng-template>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="dialog-footer">
      <button 
        mat-stroked-button 
        (click)="dialogRef.close()"
        class="cancel-btn">
        Cancel
      </button>
      <button 
        mat-flat-button 
        color="primary" 
        (click)="mergeToList()" 
        [disabled]="!selectedListId"
        class="merge-btn">
        <span>Merge to Selected List</span>
      </button>
    </div>

  </div>
</div>
