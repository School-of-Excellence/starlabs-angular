<div class="m-4">
  <div>
    <h5 class="heading">Add Remark</h5>
    <textarea class="textareafield" rows="5" cols="60" [(ngModel)]="remark"></textarea>
    <div class="btnbox">
      <button data-testid="ar-cancel-1" mat-stroked-button class="cancelbtn" (click)="cancel()">Cancel</button>
      <button data-testid="ar-submit-2" mat-stroked-button class="submitbtn" (click)="submit()">Submit</button>
    </div>
  </div>
</div>
