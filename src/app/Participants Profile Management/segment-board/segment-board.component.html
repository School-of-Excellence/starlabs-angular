<!-- Shell from Segment Board (standalone).html; the engine renders into #main, the drawer and the dialogs. -->
<div class="sb-root" #root>
<div class="app" id="app">
  <main id="main"></main>
</div>
<aside class="drawer" id="drawer" aria-label="Details"></aside>
<dialog id="moveDlg" aria-labelledby="moveTitle"><div class="dlg"></div></dialog>
<dialog id="segDlg" aria-label="Segment"><div class="dlg"></div></dialog>
<dialog id="addDlg" aria-labelledby="addTitle"><div class="dlg"></div></dialog>
<dialog id="actDlg" aria-labelledby="actTitle"><div class="dlg"></div></dialog>
<dialog id="groupDlg" aria-labelledby="groupTitle"><div class="dlg"></div></dialog>
<dialog id="teamDlg" aria-labelledby="teamTitle"><div class="dlg"></div></dialog>
<dialog id="cmpDlg" aria-labelledby="cmpTitle"><div class="dlg"></div></dialog>
<div id="selbar" class="selbar" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
</div>
