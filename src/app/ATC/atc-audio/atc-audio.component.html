<!-- The <audio> element is always in the DOM (hidden until a URL exists) so @ViewChild can
     be static and src can be assigned before it is shown. Native controls take over once
     ready — they give scrubbing and elapsed time, which a 30-minute note needs. -->
<div class="atc-audio">
  <span class="atc-audio__label" *ngIf="label">{{ label }}</span>

  <button type="button"
          data-testid="aa-start"
          class="atc-audio__start"
          *ngIf="!ready"
          [disabled]="loading"
          (click)="start()">
    {{ loading ? 'Loading…' : 'Play' }}
  </button>

  <audio #el
         data-testid="aa-player"
         class="atc-audio__player"
         [hidden]="!ready"
         controls
         (play)="ensureFresh()"
         (seeking)="ensureFresh()"
         (error)="onFail()"
         (stalled)="onFail()"
         (ended)="onEnded()"></audio>

  <!-- Deliberately not "the link expired": an <audio> error carries no HTTP status, so a
       lapsed URL and a deleted object look identical here. Testing against a missing object
       showed the old wording telling the listener to retry something that can never work. -->
  <div class="atc-audio__error" *ngIf="failed" data-testid="aa-error">
    <span>This clip could not be played.</span>
    <button type="button" data-testid="aa-retry" (click)="retry()">Try again</button>
  </div>
</div>
