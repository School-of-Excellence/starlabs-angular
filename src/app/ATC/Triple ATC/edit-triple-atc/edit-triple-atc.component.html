<div *ngIf="loading">
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
</div>

<div *ngIf="!finalATCmode" class="mainscreen">
  <div class="title">Update Triple ATC</div>
  <div class="atcdetail">
    <label class="highlight">Client Name:</label>
    <label>{{reportATC.profile_name}}</label>
    <br>
    <label class="highlight">Product:</label>
    <label>{{reportATC.product}}</label>
    <br>
    <label class="highlight">Prescribed Author(s):</label>
    <label>{{reportATC.authors}}</label>
    <br>
    <label class="highlight">Prescribed Date:</label>
    <label>{{reportATC.date | date}}</label>
    <br>
    <label class="highlight">ATC Directive:</label>
    <label>{{reportATC.directive == null ? "Directive not provided" : reportATC.directive}}</label>
    <button class="ms-3" mat-stroked-button (click)="editDirective()">Edit</button>

  </div>
  <div>
    <div class="mt-2">
      <div class="flexbox">
        <div class="heading me-2">
          Adjustments
        </div>
        <div class="heading">
          Procedures
        </div>
      </div>
    </div>
    <div *ngFor="let atc of tripleATC; let a = index">
      <div class="mt-2">
        <label class="fw-bold"><u>Perceptual Position {{a+1}}:&nbsp;</u></label><label>{{atc['position']}}</label>
      </div>
      <div *ngFor="let prescription of atc['atc']; let i = index">
        <div class="flexbox">
          <div class="adjustmentbox">
            <div *ngIf="!prescription.newadjustment">
              <label [ngClass]="prescription.adjustmentdelete ? 'strikeDelete' : null">{{prescription.adjustmentedit}}</label>
              <button mat-icon-button class="editbtn" (click)="editAdjustment(a, i); autoSave()"><mat-icon>edit</mat-icon></button>
              <br>
              <button mat-button [ngClass]="prescription.adjustmentdelete ? 'deletedbtn' : 'todeletebtn'" (click)="onAdjustmentUpdate(a, i); autoSave()">
                {{prescription.adjustmentdelete ? 'Deleted' : 'Delete Adjustment Completely'}}
              </button>
            </div>
            <div *ngIf="prescription.newadjustment">
              <textarea class="adjustmenttextarea" [(ngModel)]="prescription.adjustment" placeholder="Adjustment"></textarea>
              <button mat-icon-button class="deleteicon" (click)="removenewAdjustment(a,i); autoSave()">
                <mat-icon>remove_circle</mat-icon>
              </button>
            </div>
            <div class="mt-2" *ngIf="roles['mentor'] && !this.bigActivity()">
              <mat-checkbox [(ngModel)]="prescription.selected">Pick this Adjustment for Final ATC</mat-checkbox><br>
              <textarea class="adjustmenttextarea" [(ngModel)]="prescription.comment" placeholder="Write your comment here..."></textarea>
            </div>
          </div>
          <div class="procedurebox">
            <div class="proceduredata" *ngFor="let procedure of prescription.procedure; let j = index">
              <div *ngIf="!procedure.newprocedure">
                <label [ngClass]="procedure.proceduredelete ? 'strikeDelete' : null">- {{procedure.name}}</label>
                <button mat-icon-button (click)="onProcedureUpdated(a, i, j); autoSave()">
                  <mat-icon class="deleteicon" *ngIf="procedure.proceduredelete">remove_circle</mat-icon>
                  <mat-icon class="deleteicon" *ngIf="!procedure.proceduredelete">remove_circle_outline</mat-icon>
                </button>
              </div>
  
              <div *ngIf="procedure.newprocedure">
                <div style="display: inline;">
                  <label style="display: inline;" [ngStyle]="{'color' : prescription.adjustmentdelete ? 'red' : 'black'}" class="procedureitem">*</label>
        
                  <mat-form-field class="procedureitem" style="padding: 0;">
                    <mat-label>Procedure</mat-label>
                    <mat-select [(ngModel)]="procedure.name" (selectionChange)="autoSave()">
                      <mat-option *ngFor="let pro of procedureList" [value]="pro.path">{{pro.name}}</mat-option>
                    </mat-select>
                  </mat-form-field>
        
                  <!-- <mat-form-field class="procedureitem" style="padding: 0;">
                    <mat-label>Recommended To</mat-label>
                    <mat-select [(ngModel)]="procedure.recommended_to">
                      <mat-option [value]="null">Not Recommended</mat-option>
                      <mat-option *ngFor="let name of recommendlist" [value]="name.ref.path">{{name.data().name}}</mat-option>
                    </mat-select>
                  </mat-form-field>
        
                  <mat-form-field class="procedureitem" style="padding: 0;">
                    <mat-label>Assigned To</mat-label>
                    <mat-select [(ngModel)]="procedure.assigned_to" multiple>
                      <mat-option *ngFor="let name of assignerList" [value]="name.authorpath">{{name.authorname}} - {{levelMap[name.authorpath] == null ? 'Unspecified' : levelMap[name.authorpath].join(', ')}}</mat-option>
                    </mat-select>
                  </mat-form-field> -->
        
                  <mat-checkbox class="procedureitem" [(ngModel)]="procedure.mandatory">Mandatory</mat-checkbox>
        
                  <button class="removeprocedure" mat-icon-button (click)="removeAdditionalProcedure(a, i, j); autoSave()">
                    <mat-icon class="icon">cancel</mat-icon>
                  </button>
                </div>
              </div>
            </div>
            <button mat-button class="addnewprocedure" (click)="addAdditionalProcedure(a, i); autoSave()">
              Add Procedure
            </button>
          </div>
        </div>
      </div>
      <div class="m-3">
        <button class="text-success border-success" mat-stroked-button (click)="addnewAdjustment(a, atc['position']); autoSave()">Add another Adjustment</button>
      </div>
    </div>
  </div>

  <div *ngIf="!this.bigActivity()" class="submitarea">
    <button *ngIf="!uploading" mat-stroked-button class="submitbtn" (click)="submit()">{{roles["mentor"] ? "Update Triple ATC and Pick Selected Adjustment for Final ATC" : "Update Triple ATC"}}</button>
    <div *ngIf="!uploading && roles['mentor']">
      <br>
      <label>OR</label><br>
      <button mat-stroked-button class="submitbtn" (click)="pickForFinalATC()">Pick selected Adjustments for Final ATC</button>
    </div>
    <mat-progress-bar *ngIf="uploading" mode="indeterminate"></mat-progress-bar>
  </div>

  <div *ngIf="this.bigActivity()" class="submitarea">
    <button *ngIf="!uploading" mat-stroked-button class="submitbtn" (click)="submit()">{{"Update Triple ATC"}}</button>
    <mat-progress-bar *ngIf="uploading" mode="indeterminate"></mat-progress-bar>
  </div>
  
</div>

<div *ngIf="finalATCmode" class="mainscreen w-100">
  <div class="title">Create Final ATC</div>
  
  <div cdkDropList class="example-list me-4" (cdkDropListDropped)="drop($event)">
    <div class="example-box" *ngFor="let transcript of finalATC; let i=index" cdkDrag>
      <div class="example-custom-placeholder" *cdkDragPlaceholder></div>
      <div class="mb-4">
        <div [ngStyle]="{'color' : transcript.adjustmentdelete ? 'grey' : 'black'}">
          <button class="mb-3" mat-stroked-button cdkDragHandle>
            <mat-icon class="mb-1">reorder</mat-icon>
            Move Sequence
          </button>
          <br>
          <label class="fw-bold">Adjustment {{i+1}}:</label>{{transcript.newadjustment ? transcript.adjustment : transcript.adjustmentedit}}
          <div *ngFor="let procedure of transcript.procedure; let j = index">
            <div class="mb-2">
              <label style="display: inline-block; margin-right: 10x;" [ngStyle]="{'color' : procedure.newprocedure ? 'red' : 'black'}">*</label>
              <label [ngStyle]="{'color' : transcript.adjustmentdelete || procedure.proceduredelete ? 'grey' : 'black'}">{{procedure.newprocedure ? procedureMap[procedure.name] : procedure.name}}</label>
            </div>    
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="roles['transcriber']">
    <mat-form-field class="matfield" appearance="outline">
      <mat-label>Validator Names(s)</mat-label>
      <mat-select [(ngModel)]="reportATC.validator" multiple>
        <mat-option>
          <ngx-mat-select-search [(ngModel)]="filteredSpecialist" [placeholderLabel]="'Search'" [noEntriesFoundLabel]="'No matching records found'" ngDefaultControl></ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor=" let profile of availableSpecialistList()" [value]="profile.profileid">{{profile.name}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div *ngIf="!uploading" class="text-center">
    <button mat-stroked-button class="submitbtn me-3" (click)="finalATCmode = false">Go Back to Triple ATC</button>
    OR
    <button mat-stroked-button class="submitbtn ms-3" (click)="createFinalATC()">Create Final ATC</button>
  </div>
  <mat-progress-bar *ngIf="uploading" mode="indeterminate"></mat-progress-bar>
</div>
