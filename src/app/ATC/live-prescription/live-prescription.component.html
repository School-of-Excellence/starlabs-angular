<div class="mainscreen">

  <h4>ATC Prescription</h4>

  <label data-testid="lrx-status">{{status}}</label>
  <div *ngIf="status == null">
    <label><b>Date:</b> {{atcReport.date | date}}</label>
    <br>
    <label data-testid="lrx-owner"><b>ATC For:</b> {{mapProfiles[atcReport.atcowner]}}</label>
    <br>
    <label data-testid="lrx-product"><b>Product:</b> {{atcReport.product}}</label>
    <br>
    <label data-testid="lrx-prescribers"><b>Prescribed By:</b> {{returnNameList(atcReport.atcprescriber)}}</label>
    <br>
    <label><b>Observers:</b> {{returnNameList(atcReport.atcobserver)}}</label>
    <h5 class="heading">Adjustments and Procedures</h5>
    <div data-testid="lrx-adj" class="adjustmentbox" *ngFor="let atc of atcReport.atc; let i = index">
      <label><b>{{i+1}}.</b> {{atc.adjustment}}</label>
      <div class="procedurebox" *ngFor="let procedure of atc.procedure">
        <label data-testid="lrx-proc">- {{mapProcedures[procedure.name]}}</label>
        <label class="mandatory" *ngIf="procedure.mandatory">*</label>
        <label class="changeagent">({{returnNameList(procedure.changeagent)}})</label>
      </div>
    </div>
    <h5 class="heading">Notes</h5>
    <label><b>Consultation Summay:</b> {{atcReport.notes.summary}}</label>
    <br>
    <label><b>Consultation Points:</b> {{atcReport.notes.points}}</label>
    <br>
    <label data-testid="lrx-casenotes"><b>Case Notes:</b> {{atcReport.notes.notes}}</label>
    <br>
    <label><b>Mentor Notes</b> {{atcReport.notes.mentornotes}}</label>
  </div>
</div>
