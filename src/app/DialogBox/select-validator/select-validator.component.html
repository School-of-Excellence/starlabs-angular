<main class="d-flex flex-column justify-content-center">
  <div>
    <mat-form-field appearance="outline" style="width:300px">
      <mat-label>Select Validator</mat-label>
      <mat-select data-testid="dbs-mat-select" [(ngModel)]="selectedValidator" multiple>
        <mat-option *ngFor="let option of validatorList" [value]="option">{{option['name']}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <br>
  <div class="d-flex flex-row">
    <button data-testid="dbs-submitvalidator" mat-stroked-button type="button" class="submitbutton" [disabled]="selectedValidator.length == 0" (click)="submitValidator()">Submit</button>
    &nbsp;
    <button data-testid="dbs-closedialog" mat-stroked-button type="button" class="closebutton" (click)="closeDialog()">Close</button>
  </div>
</main>
