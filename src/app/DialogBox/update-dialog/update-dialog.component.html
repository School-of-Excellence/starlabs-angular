<div class="mainscreen">
    <mat-form-field appearance="outline">
      <textarea data-testid="dbu-textarea" matInput rows="12" cols="60" [(ngModel)]="message"></textarea>
    </mat-form-field>
    <br>
    <button data-testid="dbu-cancel" mat-stroked-button class="cancelbtn" (click)="cancel()">Cancel</button>
    <button data-testid="dbu-submit" mat-stroked-button class="submitbtn" (click)="submit()">Submit</button>
</div>
