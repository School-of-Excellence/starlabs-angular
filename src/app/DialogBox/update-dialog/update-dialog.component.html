<div class="mainscreen">
    <mat-form-field appearance="outline">
      <textarea matInput rows="12" cols="60" [(ngModel)]="message"></textarea>
    </mat-form-field>
    <br>
    <button mat-stroked-button class="cancelbtn" (click)="cancel()">Cancel</button>
    <button mat-stroked-button class="submitbtn" (click)="submit()">Submit</button>
</div>
