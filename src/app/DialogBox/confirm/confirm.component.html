<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button data-testid="dbc-oncancel" mat-stroked-button color="primary" (click)="onCancel()">
    {{ data.cancelText || 'Cancel' }}
  </button>
  <button data-testid="dbc-onconfirm" *ngIf="data.confirmText && data.confirmText.trim() !== ''" mat-flat-button color="warn" (click)="onConfirm()">
    {{ data.confirmText || 'OK' }}
  </button>
</mat-dialog-actions>
