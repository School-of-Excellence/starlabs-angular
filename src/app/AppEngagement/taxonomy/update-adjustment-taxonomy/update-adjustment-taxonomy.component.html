<main>
  <div class="d-flex flex-row justify-content-center mt-4">
    <h4>Update ATC Taxonomy Against Adjustment </h4>
  </div>
  <div class="d-flex flex-row justify-content-start ml-4">
    <mat-form-field appearance="outline" style="width:500px">
      <mat-label>Select Profile</mat-label>
      <mat-select (selectionChange)="onSelect($event)">
        <mat-option *ngFor="let option of profileData" [value]="option.profileid">
          <span style="display:inline-flex;align-items:center;gap:8px;">
            <app-profile-picture [profileId]="option.profileid" [name]="option['name']" [size]="24"></app-profile-picture>
            <span>{{option['name']}}</span>
          </span>
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
 <div>
  <!-- <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex....." #input>
  </mat-form-field> -->
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="prescription_date">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Prescription Date </th>
        <td mat-cell *matCellDef="let row" style="width:5%"> {{row.prescription_date | date : "mediumDate"}}</td>
      </ng-container>

      <ng-container matColumnDef="created">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Created Date </th>
        <td mat-cell *matCellDef="let row" style="width:5%"> {{row.created.toDate() | date : "mediumDate"}}</td>
      </ng-container>
  
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Adjustment </th>
        <td mat-cell *matCellDef="let row" style="width:30%"> {{row.name}}</td>
      </ng-container>
      <!-- [color]=" i%2 === 0 ? 'primary' : 'accent'"  -->
      <!-- <ng-container matColumnDef="tags">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Taxonomy </th>
        <td mat-cell *matCellDef="let row;let i = index" style="width:30%">
          <mat-chip-list aria-label="Fish selection">
            <mat-chip 
              [color]="'primary'" 
              selected 
              *ngFor="let tag of row['tags'];let t = index"
              [removable]="true"
              (removed)="onTagRemove(row,t)"
              >
              {{mapTaxonomy[tag]}}
              <mat-icon matChipRemove>cancel</mat-icon>
            </mat-chip>
          </mat-chip-list>
        </td>
      </ng-container> -->

      <ng-container matColumnDef="tags">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Add Tag </th>
        <td mat-cell *matCellDef="let row;let j = index" style="width:55%">
          <!-- <mat-form-field appearance="standard">
            <mat-select (selectionChange)="onUpdateTag($event,row)">
              <mat-option *ngFor="let tag of filterTags(row['tags'])" [value]="tag.id">{{tag.name}}</mat-option>
            </mat-select>
          </mat-form-field> -->
          <mat-form-field class="w-100" appearance="fill">
            <mat-chip-grid #chipList >
              <mat-chip *ngFor="let tag of row.tags;let i = index" color="primary">
                {{mapTaxonomy[tag]}}<mat-icon (click)="onTagRemove(row,i)">cancel</mat-icon>
              </mat-chip>
              <input
                [matAutocomplete]="auto"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                (keyup)="onSearchTags($event)"
                type="text"
                >
            </mat-chip-grid>
            <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onUpdateTag($event,row)">
              <mat-option *ngFor="let tagdoc of  filteredTaxonomyList | excludeFilterArrayPipe:row.tags" [value]="tagdoc.id">{{tagdoc.name}}</mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="update">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Submit </th>
        <td mat-cell *matCellDef="let row" style="width:5%">
          <button class="ml-2" mat-stroked-button type="button" (click)="onSubmit(row)">Update</button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <!-- <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
      </tr> -->
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
  </div>
 </div> 
</main>
