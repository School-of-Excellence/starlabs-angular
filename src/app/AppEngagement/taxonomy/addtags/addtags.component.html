<main>
  <div style="padding: 20px;">
    <mat-form-field>
      <mat-label>Add Tags</mat-label>
      <input data-testid="aeat-inp-1" matInput type="text" [(ngModel)]="name">
    </mat-form-field>
    <div class="d-flex justify-content-center">
      <button data-testid="aeat-btn-2" mat-stroked-button type="button" (click)="onsubmit()">
        {{data.type === 'edit' ? 'Update' : 'Submit'}}
      </button>&nbsp;&nbsp;&nbsp;&nbsp;
      <button data-testid="aeat-btn-3" mat-stroked-button type="button" (click)="dialogRef.close()">Close</button>
    </div>
  </div>
</main>
