<div class="container-fluid py-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Live Monitor</h2>
    <span class="badge bg-primary fs-6">{{openViduRoomList.length}} Live Calls</span>
  </div>

  <!-- Room Cards -->
  <div class="row g-3">
    <div class="col-12" *ngFor="let studio of openViduRoomList">
      <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-0">{{studio["title"]}}</h5>
            <small class="text-muted">Room ID: {{studio['roomid']}}</small>
          </div>
          <div>
            <button 
              class="btn btn-sm"
              [class.btn-danger]="listeningRoom == studio['roomid']"
              [class.btn-outline-primary]="listeningRoom != studio['roomid']"
              (click)="toggleListening(studio['roomid'])">
              <i class="bi" [class.bi-volume-up-fill]="listeningRoom == studio['roomid']" [class.bi-volume-mute]="listeningRoom != studio['roomid']"></i>
              {{listeningRoom == studio['roomid'] ? "Stop" : "Start"}} Listening
            </button>
            <button 
              class="btn btn-sm ms-3 text-light border-0"
              [class.btn-danger]="true"
              [class.btn-outline-primary]="true"
              (click)="endCall(studio['roomid'])">
              End Room
            </button>
          </div>
        </div>

        <div class="card-body">
          <div *ngIf="mapOpenViduRooms().get(studio['roomid']) as assignment; else nocall">
            <!-- Participant count -->
            <div class="mb-2">
              <span class="badge bg-secondary">{{getVideoParticipantCount(assignment.values())}} Participants</span>
            </div>

            <!-- Horizontal scrollable video grid -->
            <div class="video-scroll-container">
              <div class="video-grid">
                <div *ngFor="let remote of returnRemoteParticipantTrack(assignment.values())" class="video-wrapper">
                  <div class="video-tile" *ngIf="remote.trackPublication.kind === 'video'">
                    <app-openvidu-video-element
                      [track]="remote.trackPublication.videoTrack"
                      [participantIdentity]="remote.participantName">
                    </app-openvidu-video-element>

                    <!-- Name badge - bottom left -->
                    <div class="name-badge">
                      {{ remote.participantName }}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Audio elements (hidden) -->
            <div class="d-none" *ngIf="listeningRoom == studio['roomid']">
              <ng-container *ngFor="let remote of returnRemoteParticipantTrack(assignment.values())">
                <app-openvidu-audio-element
                  *ngIf="remote.trackPublication.kind === 'audio'"
                  [track]="remote.trackPublication.audioTrack">
                </app-openvidu-audio-element>
              </ng-container>
            </div>
          </div>

          <ng-template #nocall>
            <div class="text-center text-muted py-4">
              <p class="mb-0">No active participants</p>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
