<div class="mainscreen">
    <h5 class="heading">Big Activity</h5>
    <div class="body mat-elevation-z2">
      <div class="actionbox">
        <div class="actionitem">
          <mat-form-field appearance="outline">
            <mat-label>Filter</mat-label>
            <input matInput #filter (keyup)="filterTable(filter.value)" #input autocomplete="off">
          </mat-form-field>
        </div>
        <div class="actionitem">
          <button class="addbtn" mat-stroked-button (click)="updateAccount(null)">Add Activity</button>
        </div>
      </div>
      <table mat-table [dataSource]="dataSource" matSort>
  
        <ng-container matColumnDef="activity">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Activity</th>
          <td mat-cell *matCellDef="let row">{{row["activity"]}}</td>
        </ng-container>
  
        <ng-container matColumnDef="atcproperty">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ATC Property</th>
          <td mat-cell *matCellDef="let row">{{row["atcproperty"]}}</td>
        </ng-container>
  
        <ng-container matColumnDef="shadow">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Shadow Activity</th>
          <td mat-cell *matCellDef="let row">{{row["shadow"] == true ? "Yes" : "No"}}</td>
        </ng-container>
  
        <ng-container matColumnDef="activitytype">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Activity Type</th>
          <td mat-cell *matCellDef="let row">{{row["activitytype"]}}</td>
        </ng-container>
  
        <!-- <ng-container matColumnDef="procedureproperty">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Procedure Property</th>
          <td mat-cell *matCellDef="let row">{{row["procedureproperty"]}}</td>
        </ng-container>
  
        <ng-container matColumnDef="assignmentproperty">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ATC Assignment Property</th>
          <td mat-cell *matCellDef="let row">{{row["assignmentproperty"]}}</td>
        </ng-container> -->
  
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row;">
            <button class="deletebtn" mat-icon-button type="button" (click)="updateAccount(row)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell emptytext" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[25, 50, 100]"></mat-paginator>
    </div>
  </div>
