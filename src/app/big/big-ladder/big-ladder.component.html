                        <div class="bl-cell bl-left"><span class="bl-rank">{{i + 1}}</span></div>
                        <div class="bl-cell bl-left">
                            <span class="bl-avatar"
                                style="background:linear-gradient(135deg,hsl(226 62% 52%),hsl(264 64% 42%))">{{getInital(participant.name)}}</span>
                            <span class="bl-person"><span class="bl-name">{{participant.name}}</span></span>
                        </div>
                        <div class="bl-cell">{{participant.extendedlifeimpact}}</div>
                        <div class="bl-cell">{{participant.eventAttended}}</div>

                        <div class="bl-cell">57</div>
                        <div class="bl-cell">97%</div>

                        <div class="bl-cell">78</div> -->
                    </div>
                </div>
            </div>
        </div>
