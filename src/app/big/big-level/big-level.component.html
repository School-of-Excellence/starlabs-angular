<div class="mainscreen">
  <h5 class="heading" style="font-size: 16px;">B!G Level</h5>
  <div class="body mat-elevation-z2">
    <div class="actionbox">
      <div class="actionitem">
        <mat-form-field appearance="outline">
          <mat-label>Filter</mat-label>
          <input matInput (keyup)="filterTable($event)" #input autocomplete="off">
        </mat-form-field>
      </div>
      <div class="actionitem">
        <button class="addbtn" mat-stroked-button (click)="updateList(null)">Add New Level</button>
      </div>
    </div>
    <table mat-table matSort #table [dataSource]="dataSource" cdkDropList (cdkDropListDropped)="onDrop($event)" [cdkDropListDisabled]="dragDisabled">
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef mat-sort-header></th>
        <td mat-cell *matCellDef="let row; let i = index;">
          <mat-icon class="dragCursor" (mousedown)="dragDisabled = false;">reorder</mat-icon></td>
      </ng-container>
      <ng-container matColumnDef="level">
        <th class="w-50" mat-header-cell *matHeaderCellDef mat-sort-header>Level</th>
        <td class="w-50" mat-cell *matCellDef="let row">{{row["sequence"]}}. {{row["level"]}}</td>
      </ng-container>
      <ng-container matColumnDef="category">
        <th class="w-50" mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
        <td class="w-50" mat-cell *matCellDef="let row">{{row["category"]}}</td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row;">
          <button class="deletebtn" mat-icon-button type="button" (click)="updateList(row)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" cdkDrag></tr>
      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell emptytext" colspan="3">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[25, 50, 100]"></mat-paginator>
  </div>
</div>
