<div class="audio-dashboard">
  <div class="dash-header">
    <div>
      <h1 class="dash-title">Series</h1>
      <p class="dash-sub">Manage series</p>
    </div>
    <button class="btn-primary" (click)="onClick()">
      <mat-icon>add</mat-icon>
      <span>Create Series</span>
    </button>
  </div>
  <div class="filters-row">
      <div class="input-box search-box">
        <mat-icon class="ib-icon">search</mat-icon>
        <input type="text" class="ib-input" placeholder="Filter by name..."
          #input (keyup)="ApplyFilter($event)" autocomplete="off" />
      </div>
      <mat-select 
        [(ngModel)]="tierfilter" 
        (selectionChange)="applytierfilter()"
        class="cat-select" 
        style="max-width: 180px;">

        <mat-option value="all">All</mat-option>
        <mat-option value="free">Free</mat-option>
        <mat-option value="exclusive">Exclusive</mat-option>
        <mat-option value="tier">Tier</mat-option>

      </mat-select>
    </div>
  <!-- <div class="filters-row">
    <div class="input-box search-box">
      <mat-icon class="ib-icon">search</mat-icon>
      <input type="text" class="ib-input" placeholder="Filter by name..."
        #input (keyup)="ApplyFilter($event)" autocomplete="off" />
    </div>
  </div> -->
  <div class="table-outer">
    <div class="table-card">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="Series Name">
          <th mat-header-cell *matHeaderCellDef>Series Name</th>
          <td mat-cell *matCellDef="let row">
            <span class="c-name">{{ row.seriesName }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let row">
            <span class="c-name">{{ row.type | titlecase }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="Copy">
          <th mat-header-cell *matHeaderCellDef class="col-act"></th>
          <td mat-cell *matCellDef="let row" class="col-act">
            <button class="a-btn" 
            matTooltip="Copy App Link"
            matTooltipPosition="above"
            (click)="copyToClipboard(row,'breakthroughs.app')">
              <mat-icon>content_copy</mat-icon>
            </button>
          </td>
        </ng-container>
        <ng-container matColumnDef="Copyeiflix">
          <th mat-header-cell *matHeaderCellDef class="col-act"></th>
          <td mat-cell *matCellDef="let row" class="col-act">
            <button class="a-btn" 
            matTooltip="Copy EiFlix Link"
            matTooltipPosition="above"
            (click)="copyToClipboard(row,'eiflix.com')">
              <mat-icon>content_copy</mat-icon>
            </button>
          </td>
        </ng-container>
        <ng-container matColumnDef="Edit">
          <th mat-header-cell *matHeaderCellDef class="col-act"></th>
          <td mat-cell *matCellDef="let row" class="col-act">
            <button class="a-btn a-edit" (click)="onEdit(row)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>
        <ng-container matColumnDef="Delete">
          <th mat-header-cell *matHeaderCellDef class="col-act"></th>
          <td mat-cell *matCellDef="let row" class="col-act">
            <button class="a-btn a-del" (click)="ondelete(row.id)">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="data-row"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            <div class="empty">
              <mat-icon>video_library</mat-icon>
              <p>No series found</p>
            </div>
          </td>
        </tr>
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 25, 100]" showFirstLastButtons class="paginator"></mat-paginator>
  </div>
</div>
