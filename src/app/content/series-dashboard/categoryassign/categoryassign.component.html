<div class="loading" *ngIf="loading">
  <div class="spinner"></div>
  <p>Loading categories...</p>
</div>

<div class="audio-dashboard" *ngIf="!loading">
  <div class="dash-header">
    <div>
      <h1 class="dash-title">Category Assignment</h1>
      <p class="dash-sub">Manage series assigned to each category</p>
    </div>
    <button class="btn-primary" (click)="openAssignDialog()">
      <mat-icon>add</mat-icon>
      <span>Create Category</span>
    </button>
  </div>
  <div class="filters-row">
    <div class="input-box search-box">
      <mat-icon class="ib-icon">search</mat-icon>
      <input type="text" class="ib-input" placeholder="Search categories..."
        #input (keyup)="applyFilter($event)" autocomplete="off" />
    </div>
  </div>
  <div class="table-outer">
    <div class="table-card">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="categoryName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
          <td mat-cell *matCellDef="let row" class="col-title">
            <span class="c-name">{{ row.categoryName }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="series">
          <th mat-header-cell *matHeaderCellDef>Series</th>
          <td mat-cell *matCellDef="let row">
            <div class="tags-wrap" *ngIf="row.seriesList.length > 0">
              <span class="chip chip-sm" *ngFor="let s of row.seriesList">{{ s.seriesName }}</span>
            </div>
            <span class="c-size" *ngIf="row.seriesList.length === 0">No series assigned</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="Edit">
          <th mat-header-cell *matHeaderCellDef class="col-act"></th>
          <td mat-cell *matCellDef="let row" class="col-act">
            <button class="a-btn a-edit" (click)="openAssignDialog(row)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="data-row"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            <div class="empty">
              <mat-icon>category</mat-icon>
              <p>No categories matching "{{ input.value }}"</p>
            </div>
          </td>
        </tr>
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons class="paginator"></mat-paginator>
  </div>
</div>
