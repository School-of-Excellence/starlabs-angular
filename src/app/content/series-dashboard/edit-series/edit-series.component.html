<main class="d-flex flex-column">
  <span class="d-flex flex-row justify-content-center"><h3>Edit Series</h3></span>
  <form #myForm="ngForm">
    <mat-form-field appearance="outline" class="name">
      <mat-label>Series Name:</mat-label>
      <input type="text" placeholder="Series" [(ngModel)]="seriesName" 
            matInput 
            name="name"
            #name="ngModel"
            required
            minlength="4">
    </mat-form-field>
    <mat-form-field appearance="outline" class="description">
      <mat-label class='description'>Description</mat-label>
      <input type="text" placeholder="Description" [(ngModel)]="description"
            matInput
            name="description"
            #name="ngModel"
            required
            minlength="6">
            <mat-error *ngIf="!name.valid && name.touched" style="color: red;">Description required</mat-error>
    </mat-form-field>
    <!-- <mat-form-field appearance="outline" class="category">
      <mat-label>Category</mat-label>
      <mat-select [(ngModel)]="selectedCategory"  name="Categorys" #Categorys="ngModel">
        <mat-option *ngFor="let data of category" [value]="data.id">
          {{data.category}}
        </mat-option>
      </mat-select> -->
      <!-- <mat-error *ngIf="!Categorys.valid && Categorys.touched" style="color: red;">Select a category</mat-error>  -->
    <!-- </mat-form-field> -->
  <!-- <mat-error *ngIf="!Category.valid && Category.touched" style="color: red;">Select a category</mat-error>  -->
    <span class="d-flex flex-column">
      <mat-label>Hero Image</mat-label>
      <img *ngIf="seriesReceivedDoc['heroImageUrl']" [src]="seriesReceivedDoc['heroImageUrl']" controls style="width: 200px;height: 200px;">
    </span>
    <span class="d-flex flex-column">
      <mat-label>Series Thumbnail</mat-label><br>
      <img *ngIf="seriesReceivedDoc['imageUrl']" [src]="seriesReceivedDoc['imageUrl']" controls style="width: 200px;height: 200px;">
    </span>
  <!-- </div> -->
  </form>
  <div class="file">
    <label for="file">Choose an heroImage</label><br>
    <input type="file" accept="image/*" (change)="previewheroImage($event)">
    <img *ngIf="heroImageUrl" [src]="heroImageUrl" controls style="width: 100px;height: 100px;">
  </div>

  <div class="file">
    <label for="file">Choose an Image</label><br>
    <input type="file" accept="image/*" (change)="previewImage($event)">
    <img *ngIf="imageUrl" [src]="imageUrl" controls style="width: 100px;height: 100px;">
  </div>

  <mat-form-field class="filter">
    <mat-label>Filter</mat-label>
    <input matInput  placeholder="Search" #input (keyup)="ApplyFilter($event)">
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8"  matSort>
    <ng-container matColumnDef="Select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox color="primary"
                      (change)="$event ? masterToggle() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [indeterminate]="selection.hasValue() && !isAllSelected()"
                      >Select
        </mat-checkbox>
      </th> 
      <td mat-cell *matCellDef="let row"> 
        <mat-checkbox color="primary"
                      (click)="$event.stopPropagation()"
                      (change)="selection.toggle(row); updateSelectedRows()"
                      [checked]="selection.isSelected(row)">
        </mat-checkbox>
      </td>
      </ng-container>

      <ng-container matColumnDef="Title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let row">{{row.title}}</td>
      </ng-container>

      <ng-container matColumnDef="Description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let row">{{row.description}}</td>
      </ng-container>

      <ng-container matColumnDef="Series">
          <th mat-header-cell *matHeaderCellDef>Series</th>
          <td mat-cell *matCellDef="let row">{{row.seriesName}}</td>
      </ng-container>

      <ng-container matColumnDef="Thumbnail">
          <th mat-header-cell *matHeaderCellDef>Thumbnail</th>
          <td mat-cell *matCellDef="let row"><img *ngIf="row.imageUrl" [src]="row.imageUrl" controls style="width: 100px;height: 100px;"></td>
      </ng-container>

      <ng-container matColumnDef="Episode">
          <th mat-header-cell *matHeaderCellDef>Episode</th>
          <td mat-cell *matCellDef="let row"><video *ngIf="row.videoUrl" [src]="row.videoUrl" controls style="width: 100px;height: 100px;"></video></td>
      </ng-container>
      
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"  (click)="selection.toggle(row)"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[10, 25, 100]"></mat-paginator>

  <div *ngIf="rearrangedSequence.length > 0">
    <h2> Series preview</h2>
    <span>(You can rearrange the order) </span>
    <div class="list" cdkDropList (cdkDropListDropped)="drop($event)">
      <div class="box" *ngFor="let row of rearrangedSequence" cdkDrag>
        {{row.title}}
        {{row.description}}
        <img *ngIf="row.imageUrl" [src]="row.imageUrl" controls style="width: 100px;height: 100px;">
        <video *ngIf="row.videoUrl" [src]="row.videoUrl" controls style="width: 100px;height: 100px;"></video>
      </div>
    </div>
  </div>
  <br>
  <div class="d-flex flex-row justify-content-center">
    <button class="btn" mat-raised-button color="primary" (click)="onSubmit()">Update</button>&nbsp;&nbsp;
    <!-- <button  class="Updatebtn" mat-raised-button color="primary" (click)="oncancel()">Cancel</button> -->
  </div>
  
</main>
