<div style="padding: 20px;">
<div *ngIf="edit">
    <h1 mat-dialog-title>Assign Tier to Series</h1>
<!-- <div mat-dialog-content> -->

 <mat-form-field  appearance="outline">
    <input data-testid="asu-inp-001" matInput placeholder="UserName" [(ngModel)]="username" [disabled]="isDisabled">
 </mat-form-field>  
 <br>
  <mat-form-field appearance="outline">
    <mat-label>Tier</mat-label>
    <mat-select data-testid="asu-msel-002" [(ngModel)]="selectedtier" multiple [compareWith]="compareFn">
      <mat-option *ngFor="let data of tier" [value]="data.tier">
        {{data.tier}}
      </mat-option>
    </mat-select>
  </mat-form-field>
  <br>
    <button data-testid="asu-btn-003" mat-raised-button color="primary" (click)="onedit(data.id)">Submit</button>&nbsp;&nbsp;
    <button data-testid="asu-btn-004" mat-raised-button color="primary" (click)="onClick()" >Close</button>
<!-- </div> -->
</div>

<div *ngIf="delete">
  <div mat-dialog-title>
      <div mat-dialog content style="width: 350px;">
          <h3>Are you sure you want to delete?</h3>
  </div>
      <button data-testid="asu-btn-005" mat-raised-button color="primary" (click)="onClick()">Cancel</button>&nbsp;&nbsp;
      <button data-testid="asu-btn-006" mat-raised-button color="primary" mat-dialog-close (click)=" ondelete(data.id)"> Delete </button>
  </div>
</div>
</div>
