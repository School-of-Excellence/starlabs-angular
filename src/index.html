<style>
  .app-loader {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #f7f9fc, #eef2f7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
  }

  .loader-card {
    background: #ffffff;
    padding: 32px 40px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    text-align: center;
    animation: fadeIn 0.4s ease-in-out;
  }

  .spinner {
    width: 42px;
    height: 42px;
    border: 4px solid #e0e6ed;
    border-top-color: #1976d2;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 1s linear infinite;
  }

  .app-name {
    font-size: 18px;
    font-weight: 600;
    color: #1f2937;
  }

  .tagline {
    margin-top: 6px;
    font-size: 13px;
    color: #6b7280;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
