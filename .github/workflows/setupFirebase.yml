name: Setup Firebase Environments

on:
  workflow_dispatch:

jobs:
  setup-firebase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create environment files
        env:
          FIREBASE_TEST_CONFIG: ${{ secrets.FIREBASE_TEST_CONFIG }}
          FIREBASE_PROD_CONFIG: ${{ secrets.FIREBASE_PROD_CONFIG }}
          WATSON_TEST_CONFIG: ${{ secrets.WATSON_TEST_CONFIG }}
          WATSON_PROD_CONFIG: ${{ secrets.WATSON_PROD_CONFIG }}
          SALESCRM_TEST_CONFIG: ${{ secrets.SALESCRM_TEST_CONFIG }}
          SALESCRM_PROD_CONFIG: ${{ secrets.SALESCRM_PROD_CONFIG }}
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
        run: |
          mkdir -p src/environments
          
          # Create environment.development.ts
          cat > src/environments/environment.development.ts << EOF
          export const environment = {
            production: true,
            firebase: $FIREBASE_TEST_CONFIG,
            watson: $WATSON_TEST_CONFIG,
            salescrm: $SALESCRM_TEST_CONFIG,
            df3CdnUrl: 'https://breakthroughs-test.web.app/assets/df3',
            picovoiceAccessKey: $PICOVOICE_ACCESS_KEY
          };
          EOF
          
          # Create environment.ts
          cat > src/environments/environment.ts << EOF
          export const environment = {
            production: true,
            firebase: $FIREBASE_PROD_CONFIG,
            watson: $WATSON_PROD_CONFIG,
            salescrm: $SALESCRM_PROD_CONFIG,
            df3CdnUrl: 'https://breakthroughs.app/assets/df3',
            picovoiceAccessKey: $PICOVOICE_ACCESS_KEY
          };
          EOF

          # Create Firebase Messaging
          cat > src/firebase-messaging-sw.js << EOF
          importScripts('https://www.gstatic.com/firebasejs/7.6.0/firebase-app.js');
          importScripts('https://www.gstatic.com/firebasejs/7.6.0/firebase-messaging.js');

          firebase.initializeApp($FIREBASE_TEST_CONFIG);
          firebase.messaging();
          EOF
      
      - name: Upload environment files
        uses: actions/upload-artifact@v4
        with:
          name: environment-files
          path: src/environments/
          retention-days: 1