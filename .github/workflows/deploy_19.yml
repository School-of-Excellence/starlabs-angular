name: Deploy to Firebase

# AUTO-DEPLOY ON MERGE (the only model — no "merged-but-not-deployed" gap).
#   • merge into development / cicd-dev  → deploy to TEST  (starlabs-test)
#   • merge into production  / cicd-prod → deploy to LIVE  (fir-sample-aae4a)
#   cicd-dev / cicd-prod are validation stand-ins; remove after cutover.
on:
  push:
    branches:
      - development
      - cicd-dev
      - production
      - cicd-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.16.0'

      - name: Set deploy environment
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/development" || "${{ github.ref }}" == "refs/heads/cicd-dev" ]]; then
            echo "DEPLOY_ENV=test" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          fi

      - name: Generate Environment Files
        env:
          FIREBASE_TEST_CONFIG: ${{ secrets.FIREBASE_TEST_CONFIG }}
          FIREBASE_PROD_CONFIG: ${{ secrets.FIREBASE_PROD_CONFIG }}
          WATSON_TEST_CONFIG: ${{ secrets.WATSON_TEST_CONFIG }}
          WATSON_PROD_CONFIG: ${{ secrets.WATSON_PROD_CONFIG }}
          SALESCRM_TEST_CONFIG: ${{ secrets.SALESCRM_TEST_CONFIG }}
          SALESCRM_PROD_CONFIG: ${{ secrets.SALESCRM_PROD_CONFIG }}
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
        run: |
          mkdir -p src/environments

          if [ "$DEPLOY_ENV" == "test" ]; then
            FIREBASE_CONFIG=$FIREBASE_TEST_CONFIG
            WATSON_CONFIG=$WATSON_TEST_CONFIG
            SALESCRM_CONFIG=$SALESCRM_TEST_CONFIG
            CDN_URL='https://breakthroughs-test.web.app/assets/df3'
            ZOOM_API_URL='https://zoom-to-dropbox-server-rhdwzw46ya-uc.a.run.app'
          else
            FIREBASE_CONFIG=$FIREBASE_PROD_CONFIG
            WATSON_CONFIG=$WATSON_PROD_CONFIG
            SALESCRM_CONFIG=$SALESCRM_PROD_CONFIG
            CDN_URL='https://breakthroughs.app/assets/df3'
            # TODO: set to the production zoom-to-dropbox server URL when one exists.
            # Left empty so prod never silently hits the starlabs-test Cloud Run service.
            ZOOM_API_URL=''
          fi

          cat > src/environments/environment.development.ts << EOF
          export const environment = {
            production: true,
            firebase: $FIREBASE_CONFIG,
            watson: $WATSON_CONFIG,
            salescrm: $SALESCRM_CONFIG,
            df3CdnUrl: '$CDN_URL',
            zoomMigrationApiUrl: '$ZOOM_API_URL',
            picovoiceAccessKey: $PICOVOICE_ACCESS_KEY
          };
          EOF

          cat > src/environments/environment.ts << EOF
          export const environment = {
            production: true,
            firebase: $FIREBASE_CONFIG,
            watson: $WATSON_CONFIG,
            salescrm: $SALESCRM_CONFIG,
            df3CdnUrl: '$CDN_URL',
            zoomMigrationApiUrl: '$ZOOM_API_URL',
            picovoiceAccessKey: $PICOVOICE_ACCESS_KEY
          };
          EOF

          cat > src/firebase-messaging-sw.js << EOF
          importScripts('https://www.gstatic.com/firebasejs/7.6.0/firebase-app.js');
          importScripts('https://www.gstatic.com/firebasejs/7.6.0/firebase-messaging.js');

          firebase.initializeApp($FIREBASE_CONFIG);
          firebase.messaging();
          EOF

      - name: Update Firebase Site
        run: |
          if [ "$DEPLOY_ENV" == "test" ]; then
            jq '.hosting.site = "breakthroughs-test"' firebase.json > firebase.json.tmp && mv firebase.json.tmp firebase.json
          else
            jq '.hosting.site = "star-labs"' firebase.json > firebase.json.tmp && mv firebase.json.tmp firebase.json
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14.4.0

      - name: Install Angular CLI
        run: npm install -g @angular/cli@19.2.13

      - name: Build Angular App
        run: ng build --configuration production

      - name: Authenticate with Firebase & Deploy
        run: |
          if [ "$DEPLOY_ENV" == "test" ]; then
            echo '${{ secrets.GOOGLE_SERVICE_TEST }}' > $HOME/firebase-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json
            firebase use --add starlabs-test
          else
            echo '${{ secrets.GOOGLE_SERVICE_PROD }}' > $HOME/firebase-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json
            firebase use --add fir-sample-aae4a
          fi
          firebase deploy --only hosting
