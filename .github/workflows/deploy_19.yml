name: Deploy to Firebase

# CI/CD plan enforcement (deploy-gate, not branch-lock):
#   • Stage 3 — push to `development` AUTO-deploys to the TEST project (starlabs-test).
#   • Stage 4 — PRODUCTION deploy is MANUAL ONLY: workflow_dispatch from the `production` branch,
#               restricted to the maintainer allowlist (github.actor). A raw push to `production`
#               NO LONGER deploys (that trigger was removed — it was an unguarded prod-deploy footgun).
#   The `branch-guard` workflow additionally alerts/reverts stray direct pushes to protected branches.
on:
  push:
    branches:
      - development          # Stage 3: auto-deploy to TEST
  workflow_dispatch:         # Stage 4: manual, allowlisted PRODUCTION deploy (run it from the `production` branch)

permissions:
  contents: read

jobs:
  # ── Gate: only an allowlisted maintainer may dispatch a production deploy, and only from `production`.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production allowlist + source branch
        if: github.event_name == 'workflow_dispatch'
        env:
          ALLOWLIST: 'vignesh-027'        # maintainer allowlist (space-separated). Add usernames as needed.
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
        run: |
          echo "Manual production deploy requested by: $ACTOR (ref: $REF)"
          case " $ALLOWLIST " in
            *" $ACTOR "*) echo "✓ $ACTOR is allowlisted for production." ;;
            *) echo "::error::$ACTOR is NOT in the production deploy allowlist ($ALLOWLIST). Refusing."; exit 1 ;;
          esac
          if [ "$REF" != "refs/heads/production" ]; then
            echo "::error::Production deploy must be dispatched from the 'production' branch (got $REF). Refusing."; exit 1
          fi

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.16.0'

      - name: Generate Environment Files
        env:
          FIREBASE_TEST_CONFIG: ${{ secrets.FIREBASE_TEST_CONFIG }}
          FIREBASE_PROD_CONFIG: ${{ secrets.FIREBASE_PROD_CONFIG }}
          WATSON_TEST_CONFIG: ${{ secrets.WATSON_TEST_CONFIG }}
          WATSON_PROD_CONFIG: ${{ secrets.WATSON_PROD_CONFIG }}
          SALESCRM_TEST_CONFIG: ${{ secrets.SALESCRM_TEST_CONFIG }}
          SALESCRM_PROD_CONFIG: ${{ secrets.SALESCRM_PROD_CONFIG }}
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
        run: |
          mkdir -p src/environments

          if [ "${{ github.ref }}" == "refs/heads/development" ]; then
            # Test branch - use TEST config for both files
            cat > src/environments/environment.development.ts << EOF
          export const environment = {
            production: true,
            firebase: $FIREBASE_TEST_CONFIG,
            watson: $WATSON_TEST_CONFIG,
            salescrm: $SALESCRM_TEST_CONFIG,
            df3CdnUrl: 'https://breakthroughs-test.web.app/assets/df3',
            picovoiceAccessKey: $PICOVOICE_ACCESS_KEY
          };
          EOF

            cat > src/environments/environment.ts << EOF
          export const environment = {
            production: true,
            firebase: $FIREBASE_TEST_CONFIG,
            watson: $WATSON_TEST_CONFIG,
            salescrm: $SALESCRM_TEST_CONFIG,
            df3CdnUrl: 'https://breakthroughs-test.web.app/assets/df3',
            picovoiceAccessKey: $PICOVOICE_ACCESS_KEY
          };
          EOF
            cat > src/firebase-messaging-sw.js << EOF
          importScripts('https://www.gstatic.com/firebasejs/7.6.0/firebase-app.js');
          importScripts('https://www.gstatic.com/firebasejs/7.6.0/firebase-messaging.js');

          firebase.initializeApp($FIREBASE_TEST_CONFIG);
          firebase.messaging();
          EOF
          else
            # Production branch - use PROD config for both files
            cat > src/environments/environment.development.ts << EOF
          export const environment = {
            production: true,
            firebase: $FIREBASE_PROD_CONFIG,
            watson: $WATSON_PROD_CONFIG,
            salescrm: $SALESCRM_PROD_CONFIG,
            df3CdnUrl: 'https://breakthroughs.app/assets/df3',
            picovoiceAccessKey: $PICOVOICE_ACCESS_KEY
          };
          EOF

            cat > src/environments/environment.ts << EOF
          export const environment = {
            production: true,
            firebase: $FIREBASE_PROD_CONFIG,
            watson: $WATSON_PROD_CONFIG,
            salescrm: $SALESCRM_PROD_CONFIG,
            df3CdnUrl: 'https://breakthroughs.app/assets/df3',
            picovoiceAccessKey: $PICOVOICE_ACCESS_KEY
          };
          EOF
            cat > src/firebase-messaging-sw.js << EOF
          importScripts('https://www.gstatic.com/firebasejs/7.6.0/firebase-app.js');
          importScripts('https://www.gstatic.com/firebasejs/7.6.0/firebase-messaging.js');

          firebase.initializeApp($FIREBASE_PROD_CONFIG);
          firebase.messaging();
          EOF
          fi

      - name: Update Firebase Site
        run: |
          if [ "${{ github.ref }}" == "refs/heads/development" ]; then
            jq '.hosting.site = "breakthroughs-test"' firebase.json > firebase.json.tmp && mv firebase.json.tmp firebase.json
          else
            jq '.hosting.site = "star-labs"' firebase.json > firebase.json.tmp && mv firebase.json.tmp firebase.json
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14.4.0

      - name: Install Angular CLI
        run: npm install -g @angular/cli@19.2.13

      - name: Build Angular App
        run: ng build --configuration production

      - name: Authenticate with Firebase & Set Project
        run: |
          if [ "${{ github.ref }}" == "refs/heads/development" ]; then
            echo '${{ secrets.GOOGLE_SERVICE_TEST }}' > $HOME/firebase-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json
            firebase use --add starlabs-test
            firebase deploy
          elif [ "${{ github.ref }}" == "refs/heads/production" ]; then
            echo '${{ secrets.GOOGLE_SERVICE_PROD }}' > $HOME/firebase-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json
            firebase use --add fir-sample-aae4a
            firebase deploy
          fi
