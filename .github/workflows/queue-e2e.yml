# queue-e2e — the hermetic Playwright gate for the Angular app (Starlabs 19).
#
# WHAT IT DOES
#   On a PR to `development`, this assembles a single CI workspace from THREE repos and runs the
#   queue e2e suite against the REAL Cloud-Function triggers in the Firebase emulator:
#     • starlabs-angular        (this repo — the app under test)              checked out at the root
#     • starlabs-e2e-tests      (the Playwright engine + ci/overlay)          cloned into ./e2e
#     • starlabs-cloud-function (the real Firestore triggers)                 cloned into ./starlabs-cloud-function
#   Then e2e/ci/setup-emulator-config.sh OVERLAYS the emulator wiring onto the app (firebase.emulator.json,
#   firestore rules/indexes, environment.emulator.ts, angular.json emulator config, start:emulator script),
#   boots the emulator + CF, serves the app emulator-wired on :4200, and runs the isolated suite.
#
#   This is the Stage-2 gate from the CI/CD plan. It runs AUTOMATICALLY on the PR (pre-merge); a human
#   still merges. It is report-only until the queue suite is observed-green (then make it a required check).
#
# ── ONE SECRET REQUIRED ─────────────────────────────────────────────────────────────────────────────
#   CICD_PAT — a fine-grained PAT with READ access to BOTH private repos:
#              School-of-Excellence/starlabs-e2e-tests  AND  School-of-Excellence/starlabs-cloud-function
#   (Add it as a repo or org secret. The default GITHUB_TOKEN cannot read other private repos.)
name: queue-e2e (emulator gate)

on:
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/app/queue system/**'
      - 'src/app/**.guard.ts'
      - 'angular.json'
      - 'package.json'
      - '.github/workflows/queue-e2e.yml'
  workflow_dispatch: {}

# Cost control: skip the heavy gate on DRAFT PRs unless explicitly labeled `run-e2e`.
# (On GitHub Free a required check can't be enforced anyway; this keeps Actions minutes sane.)
jobs:
  queue-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FIREBASE_PROJECT: demo-slabs-queue   # demo id — deploy-cf-emulator.sh HARD-ABORTS on any prod id
      CF_BRANCH: development                # the Cloud-Functions working branch
      CI: 'true'
    steps:
      - name: Checkout app (starlabs-angular)
        uses: actions/checkout@v4

      - name: Clone the E2E engine repo (starlabs-e2e-tests) → ./e2e
        uses: actions/checkout@v4
        with:
          repository: School-of-Excellence/starlabs-e2e-tests
          ref: main
          path: e2e
          token: ${{ secrets.CICD_PAT }}

      - name: Clone the Cloud Functions repo (real triggers) → ./starlabs-cloud-function
        run: |
          if [ -z "${{ secrets.CICD_PAT }}" ]; then
            echo "::error::CICD_PAT secret is not set — needed to clone the private CF repo."; exit 1
          fi
          git clone --depth 1 --branch "$CF_BRANCH" \
            "https://x-access-token:${{ secrets.CICD_PAT }}@github.com/School-of-Excellence/starlabs-cloud-function.git" \
            starlabs-cloud-function

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # functions/package.json engines.node == 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # the Firestore/Auth emulators require a JRE

      - name: Overlay emulator config from the e2e repo onto the app
        run: bash e2e/ci/setup-emulator-config.sh   # runs from the app root (pwd)

      - name: Install firebase-tools
        run: npm i -g firebase-tools@latest

      - name: Install app deps
        run: npm ci --legacy-peer-deps

      - name: Install Cloud Functions deps
        run: cd starlabs-cloud-function/functions && npm ci

      - name: Install e2e deps
        run: cd e2e && npm ci

      - name: Install Playwright chromium
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Boot Firebase emulator + Cloud Functions
        run: |
          cd e2e && nohup bash scripts/deploy-cf-emulator.sh > /tmp/emu.log 2>&1 &
          for i in $(seq 1 90); do grep -q "All emulators ready" /tmp/emu.log && break; sleep 2; done
          if ! grep -q "All emulators ready" /tmp/emu.log; then echo "::error::emulator failed to boot"; cat /tmp/emu.log; exit 1; fi
          grep -E "functions: Loaded|All emulators ready" /tmp/emu.log

      - name: Boot emulator-wired Angular app
        run: |
          nohup npm run start:emulator > /tmp/app.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://localhost:4200 >/dev/null 2>&1 && break; sleep 3; done
          if ! curl -sf http://localhost:4200 >/dev/null 2>&1; then echo "::error::app failed to serve on :4200"; tail -60 /tmp/app.log; exit 1; fi

      - name: Run isolated queue e2e suite (the gate)
        run: cd e2e && EMU_REUSE=1 EMU_REUSE_APP=1 TESTRUNID=run1 bash scripts/run-isolated.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
