# queue-e2e — THIN CALLER for the Stage-2 hermetic Playwright gate.
#
# The gate logic now lives in the hub (starlabs-e2e-tests/.github/workflows/web-e2e.yml). This file just
# wires the app's PR triggers + path filters to it. To change boot/seed/run behavior, edit the hub workflow
# once and every repo inherits it — no per-repo copy to keep in sync (SETUP.md §6.3 "invert to reusable").
#
# Requires: org secret CICD_PAT (read access to the private e2e + cloud-function repos), passed via
# `secrets: inherit`. The hub repo must allow its workflows to be reused org-wide (Settings → Actions → Access).
name: queue-e2e (emulator gate)

on:
  pull_request:
    branches: [development, cicd-dev]   # cicd-dev = TEST stand-in for development. Remove after validation.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/app/queue system/**'
      - 'src/app/**.guard.ts'
      - 'angular.json'
      - 'package.json'
      - '.github/workflows/queue-e2e.yml'
  workflow_dispatch: {}

jobs:
  gate:
    # Cost control: skip the heavy gate on DRAFT PRs unless explicitly labeled `run-e2e`.
    # (On GitHub Free a required check can't be enforced anyway; this keeps Actions minutes sane.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    uses: School-of-Excellence/starlabs-e2e-tests/.github/workflows/web-e2e.yml@main
    with:
      cf_branch: development
      e2e_ref: main
    secrets: inherit
