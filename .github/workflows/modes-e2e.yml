# modes-e2e — THIN CALLER for the Stage-2 hermetic Playwright gate (MODES system).
#
# Mirrors authroles/business/content/comms/workshops/evomap callers: the gate logic lives in the hub
# (starlabs-e2e-tests/.github/workflows/web-e2e.yml); this file just wires the app's PR triggers + path
# filters and selects the MODES suite via `config` + `suite`. Requires repo/org secret with read on the
# private e2e + cloud-function repos, passed via `secrets: inherit`.
#
# ✅ PROMOTED TO @main (2026-07-01): the modes ENGINE files (playwright.modes.emulator(.evidence).config.ts,
#    modes/support/emulator-global-setup|teardown.ts, seed-modes.js initAdminAuto) are now on hub `main`
#    (identical to `systems-emulator`), and the gate went GREEN (run #2, 5m50s) after the CF fixes on
#    `cicd-modes-emulator-fix`. `uses:` + `e2e_ref:` flipped `systems-emulator` → `main`. REPORT-ONLY
#    (non-required) until proven green N times. `cf_branch` stays on the feature branch until the CF team
#    merges it to `development` (then flip cf_branch → development too).
#
# CF NOTE: 9 modes cases assert the `calculateParticipantMode` CF side-effect. That CF is already in the
#   emulator deploy set (index.emulator.js, participantmode v2). It requires firebase-functions@7-compatible
#   tooling: this gate installs firebase-tools@latest (15.x), which loads the v7 codebase (local
#   firebase-tools 14.4.0 cannot — its emulator runtime calls the removed functions.config()).
name: modes-e2e (emulator gate)

on:
  pull_request:
    branches: [cicd-dev, cicd-prod]   # sudo branches — match the other emulator gates. Switch to [development] at cutover.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/app/AppEngagement/**'
      - 'src/app/Product Designer/view-product-mode-playlist/**'
      - 'src/app/**.guard.ts'
      - 'angular.json'
      - 'package.json'
      - '.github/workflows/modes-e2e.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Spec subset (space-separated). Empty = all modes specs.'
        type: string
        default: ''
      evidence:
        description: '1 = capture screenshots + traces (to debug a CI-only failure)'
        type: string
        default: '0'

jobs:
  gate:
    # Cost control: skip the heavy gate on DRAFT PRs unless explicitly labeled `run-e2e`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    uses: School-of-Excellence/starlabs-e2e-tests/.github/workflows/web-e2e.yml@main
    with:
      cf_branch: cicd-modes-emulator-fix              # CF feature branch: adds the calculateParticipantMode delete-guard (emulator shared-runtime crash fix). Flip back to `development` once the guard merges there.
      e2e_ref: main                                  # PROMOTED to hub `main` (modes engine merged via hub PR #3; gate green 2026-07-01)
      firebase_project: starlabs-cicd                # MUST match the app's projectId or auth silently fails
      config: playwright.modes.emulator.evidence.config.ts  # EVIDENCE variant: screenshot+trace per test → browsable report
      suite: modes                                   # spec root (modes/) + history audit tag
      only: ${{ (github.event_name == 'workflow_dispatch' && inputs.only) || '' }}
      evidence: ${{ (github.event_name == 'workflow_dispatch' && inputs.evidence) || '1' }}
    secrets: inherit
