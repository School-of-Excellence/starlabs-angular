# workshops-e2e — THIN CALLER for the Stage-2 hermetic Playwright gate (WORKSHOPS system).
#
# Mirrors authroles/business/content/comms callers: the gate logic lives in the hub
# (starlabs-e2e-tests/.github/workflows/web-e2e.yml); this file just wires the app's PR triggers + path
# filters and selects the WORKSHOPS suite via `config` + `suite`. Requires repo/org secret with read on the
# private e2e + cloud-function repos, passed via `secrets: inherit`.
#
# ⚠️ VALIDATION PIN: the workshops ENGINE files (playwright.workshops.emulator(.evidence).config.ts,
#    workshops/support/emulator-global-setup|teardown.ts, seed-workshops.js initAdminAuto) live on the hub
#    branch `systems-emulator`, NOT yet on hub `main` (authroles + business + the shared lib already merged).
#    So `uses:` + `e2e_ref:` are pinned there; flip BOTH to `@main` / `main` after the next hub merge.
#    REPORT-ONLY (non-required) until proven green N times, then promote per-system.
# Re-validate after the WS-02 console-guard fix (benign "No such document!" first-emission).
name: workshops-e2e (emulator gate)

on:
  pull_request:
    branches: [cicd-dev, cicd-prod]   # sudo branches — match the other emulator gates. Switch to [development] at cutover.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/app/New-Workshop/**'
      - 'src/app/Workshop/**'
      - 'src/app/**.guard.ts'
      - 'angular.json'
      - 'package.json'
      - '.github/workflows/workshops-e2e.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Spec subset (space-separated). Empty = all workshops specs.'
        type: string
        default: ''
      evidence:
        description: '1 = capture screenshots + traces (to debug a CI-only failure)'
        type: string
        default: '0'

jobs:
  gate:
    # Cost control: skip the heavy gate on DRAFT PRs unless explicitly labeled `run-e2e`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    uses: School-of-Excellence/starlabs-e2e-tests/.github/workflows/web-e2e.yml@main
    with:
      cf_branch: development
      e2e_ref: main                      # VALIDATION PIN — flip to `main` after the hub merge
      firebase_project: starlabs-cicd                # MUST match the app's projectId or auth silently fails
      config: playwright.workshops.emulator.evidence.config.ts  # EVIDENCE variant: screenshot+trace per test → browsable report
      suite: workshops                               # spec root (workshops/) + history audit tag
      only: ${{ (github.event_name == 'workflow_dispatch' && inputs.only) || '' }}
      evidence: ${{ (github.event_name == 'workflow_dispatch' && inputs.evidence) || '1' }}
    secrets: inherit
