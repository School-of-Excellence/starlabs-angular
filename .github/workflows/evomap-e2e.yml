# evomap-e2e — THIN CALLER for the Stage-2 hermetic Playwright gate (EVOMAP system).
#
# Mirrors authroles/business/content/comms/workshops callers: the gate logic lives in the hub
# (starlabs-e2e-tests/.github/workflows/web-e2e.yml); this file just wires the app's PR triggers + path
# filters and selects the EVOMAP suite via `config` + `suite`. Requires repo/org secret with read on the
# private e2e + cloud-function repos, passed via `secrets: inherit`.
#
# ⚠️ VALIDATION PIN: the evomap ENGINE files (playwright.evomap.emulator(.evidence).config.ts,
#    evomap/support/emulator-global-setup|teardown.ts, seed-evomap.js initAdminAuto) live on the hub
#    branch `systems-emulator`, NOT yet on hub `main` (authroles + business + the shared lib already merged).
#    So `uses:` + `e2e_ref:` are pinned there; flip BOTH to `@main` / `main` after the next hub merge.
#    REPORT-ONLY (non-required) until proven green N times, then promote per-system.
# Watch-out: evomap has one aux composite index (Last-Video column) flagged-not-asserted; EM-02 is a fixme.
name: evomap-e2e (emulator gate)

on:
  pull_request:
    branches: [development, production]   # CUTOVER 2026-07-05: real release branches (was [cicd-dev, cicd-prod])
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/app/EvolutionMapping/**'
      - 'src/app/**.guard.ts'
      - 'angular.json'
      - 'package.json'
      - '.github/workflows/evomap-e2e.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Spec subset (space-separated). Empty = all evomap specs.'
        type: string
        default: ''
      evidence:
        description: '1 = capture screenshots + traces (to debug a CI-only failure)'
        type: string
        default: '0'

jobs:
  gate:
    # Cost control: skip the heavy gate on DRAFT PRs unless explicitly labeled `run-e2e`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    uses: School-of-Excellence/starlabs-e2e-tests/.github/workflows/web-e2e.yml@main
    with:
      cf_branch: development
      e2e_ref: main                      # VALIDATION PIN — flip to `main` after the hub merge
      firebase_project: starlabs-cicd                # MUST match the app's projectId or auth silently fails
      config: playwright.evomap.emulator.evidence.config.ts  # EVIDENCE variant: screenshot+trace per test → browsable report
      suite: evomap                                  # spec root (evomap/) + history audit tag
      only: ${{ (github.event_name == 'workflow_dispatch' && inputs.only) || '' }}
      evidence: ${{ (github.event_name == 'workflow_dispatch' && inputs.evidence) || '1' }}
    secrets: inherit
