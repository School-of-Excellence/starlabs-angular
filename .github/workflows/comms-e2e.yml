# comms-e2e — THIN CALLER for the Stage-2 hermetic Playwright gate (COMMS system).
#
# Mirrors authroles-e2e.yml / business-e2e.yml / content-e2e.yml: the gate logic lives in the hub
# (starlabs-e2e-tests/.github/workflows/web-e2e.yml); this file just wires the app's PR triggers + path
# filters and selects the COMMS suite via `config` + `suite`. Requires repo/org secret with read on the
# private e2e + cloud-function repos, passed via `secrets: inherit`.
#
# ⚠️ VALIDATION PIN: the comms ENGINE files (playwright.comms.emulator(.evidence).config.ts,
#    comms/support/emulator-global-setup|teardown.ts, seed-comms.js initAdminAuto) live on the hub branch
#    `systems-emulator`, NOT yet on hub `main` (authroles + business + the shared lib already merged). So
#    `uses:` + `e2e_ref:` are pinned at that branch; flip BOTH to `@main` / `main` after the next hub merge.
#    REPORT-ONLY (non-required) until proven green N times, then promote per-system.
#
# NOTE: comms has 5 CF-gated cases that self-skip on the emulator (comms CFs not in the deploy set yet);
#    they become real runs once those CFs are added to deploy-cf-emulator.sh (planned with modes, rank 7).
# CN-14 resolution (hub systems-emulator @ 287274b): the REAL root cause is an app-branch DIVERGENCE — the
# /onewaytemplates feature (route + OnewayTemplatesComponent) exists only on the app's `cicd` branch, NOT on
# cicd-dev (which this gate builds), so the screen does not exist in CI and nav falls to the ** catch-all.
# CN-14 now reads the live Router config and self-skips when the route is absent (like the CF-gated skips);
# it runs for real once OneWayAppCommunication merges into cicd-dev. Expect comms GREEN with CN-14 skipped.
name: comms-e2e (emulator gate)

on:
  pull_request:
    branches: [cicd-dev, cicd-prod]   # sudo branches — match the other emulator gates. Switch to [development] at cutover.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/app/Channel Communication/**'
      - 'src/app/Communication Center/**'
      - 'src/app/AppEngagement/**'
      - 'src/app/**.guard.ts'
      - 'angular.json'
      - 'package.json'
      - '.github/workflows/comms-e2e.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Spec subset (space-separated). Empty = all comms specs.'
        type: string
        default: ''
      evidence:
        description: '1 = capture screenshots + traces (to debug a CI-only failure)'
        type: string
        default: '0'

jobs:
  gate:
    # Cost control: skip the heavy gate on DRAFT PRs unless explicitly labeled `run-e2e`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    uses: School-of-Excellence/starlabs-e2e-tests/.github/workflows/web-e2e.yml@main
    with:
      cf_branch: development
      e2e_ref: main                      # VALIDATION PIN — flip to `main` after the hub merge
      firebase_project: starlabs-cicd                # MUST match the app's projectId or auth silently fails
      config: playwright.comms.emulator.evidence.config.ts  # EVIDENCE variant: screenshot+trace per test → browsable report
      suite: comms                                   # spec root (comms/) + history audit tag
      only: ${{ (github.event_name == 'workflow_dispatch' && inputs.only) || '' }}
      evidence: ${{ (github.event_name == 'workflow_dispatch' && inputs.evidence) || '1' }}
    secrets: inherit
