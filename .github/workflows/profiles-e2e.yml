# profiles-e2e — THIN CALLER for the Stage-2 hermetic Playwright gate (PROFILES system).
#
# Mirrors the other system callers: the gate logic lives in the hub
# (starlabs-e2e-tests/.github/workflows/web-e2e.yml); this file just wires the app's PR triggers + path
# filters and selects the PROFILES suite via `config` + `suite`. Requires repo/org secret with read on the
# private e2e + cloud-function repos, passed via `secrets: inherit`.
#
# ⚠️ VALIDATION PIN: the profiles ENGINE files (playwright.profiles.emulator(.evidence).config.ts,
#    profiles/support/emulator-global-setup|teardown.ts, seed-profiles.js initAdminAuto) live on the hub
#    branch `systems-emulator`, NOT yet on hub `main`. So `uses:` + `e2e_ref:` are pinned there; flip BOTH to
#    `@main` / `main` after the next systems-emulator → main merge. REPORT-ONLY until proven green N times.
# Watch-outs: PA-CF-01..05 assert participant-metadata Cloud Function output (CFs are in the emulator set);
#    PA-13/14 (firestore-forms NAMED DB, client read/write) test.skip on the emulator — the Firestore emulator
#    does not support named-db rules — and run on the cloud profiles config; PA-FT-FILT is a fixme.
name: profiles-e2e (emulator gate)

on:
  pull_request:
    branches: [cicd-dev, cicd-prod]   # sudo branches — match the other emulator gates. Switch to [development] at cutover.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/app/Participants Profile Management/**'
      - 'src/app/**.guard.ts'
      - 'angular.json'
      - 'package.json'
      - '.github/workflows/profiles-e2e.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Spec subset (space-separated). Empty = all profiles specs.'
        type: string
        default: ''
      evidence:
        description: '1 = capture screenshots + traces (to debug a CI-only failure)'
        type: string
        default: '0'

jobs:
  gate:
    # Cost control: skip the heavy gate on DRAFT PRs unless explicitly labeled `run-e2e`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    uses: School-of-Excellence/starlabs-e2e-tests/.github/workflows/web-e2e.yml@systems-emulator
    with:
      cf_branch: cicd-modes-emulator-fix              # CF feature branch with the participant-metadata CF fixes (profiledata/productsdata_to_pmd). Flip to `development` once the CF team merges cicd-modes-emulator-fix there.
      e2e_ref: systems-emulator                      # VALIDATION PIN — flip to `main` after the hub merge
      firebase_project: starlabs-cicd                # MUST match the app's projectId or auth silently fails
      config: playwright.profiles.emulator.evidence.config.ts  # EVIDENCE variant: screenshot+trace per test → browsable report
      suite: profiles                                # spec root (profiles/) + history audit tag
      only: ${{ (github.event_name == 'workflow_dispatch' && inputs.only) || '' }}
      evidence: ${{ (github.event_name == 'workflow_dispatch' && inputs.evidence) || '1' }}
    secrets: inherit

# re-validate 2026-07-01: PA-09 fix on hub systems-emulator (49ed922) — analytics name-cell
# route diverges cicd(/profilesummary) vs cicd-dev(/userprofile); regex broadened to accept both.
# e2e_ref: systems-emulator resolves the branch tip at run time → this run picks up 49ed922.
