# support-e2e — THIN CALLER for the Stage-2 hermetic Playwright gate (CUSTOMER SUPPORT system).
#
# Mirrors content-e2e.yml / the other callers: the gate logic lives in the hub
# (starlabs-e2e-tests/.github/workflows/web-e2e.yml); this file just wires the dispatch and selects the
# SUPPORT suite via `config` + `suite`. Requires repo/org secret with read on the private e2e +
# cloud-function repos, passed via `secrets: inherit`.
#
# WHY THIS EXISTS: the `support` suite (src/app/Customer Support/**) had specs since the initial commit but
# was ciReady:false in suites-manifest.json — there was no emulator config, so it could not join the CI gate,
# and any Customer Support change reported SUITES_MISSING in the console ("no suite covers"). The emulator
# config now exists (playwright.support.emulator.config.ts), so this caller lets the suite run in CI; once
# it is green N times, flip suites.support.ciReady -> true in the hub manifest + re-run suites-deploy so the
# console credits it.
name: support-e2e (emulator gate)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Spec subset (space-separated). Empty = all support specs.'
        type: string
        default: ''
      evidence:
        description: '1 = capture screenshots + traces (to debug a CI-only failure)'
        type: string
        default: '0'

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    uses: School-of-Excellence/starlabs-e2e-tests/.github/workflows/web-e2e.yml@main
    with:
      cf_branch: development
      e2e_ref: main
      firebase_project: starlabs-cicd                # MUST match the app's projectId or auth silently fails
      config: playwright.support.emulator.config.ts  # hermetic emulator config for the support suite
      suite: support                                 # spec root (support/) + history audit tag
      only: ${{ (github.event_name == 'workflow_dispatch' && inputs.only) || '' }}
      evidence: ${{ (github.event_name == 'workflow_dispatch' && inputs.evidence) || '0' }}
    secrets: inherit
