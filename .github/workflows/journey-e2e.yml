# journey-e2e — THIN CALLER for the Stage-2 hermetic Playwright gate (JOURNEY & PRODUCTS system).
#
# Mirrors queue-e2e.yml: the gate logic lives in the hub (starlabs-e2e-tests/.github/workflows/web-e2e.yml);
# this file just wires the app's PR triggers + path filters and selects the JOURNEY suite via `config` + `suite`.
# Requires repo secret REPO_PAT (read on the private e2e + cloud-function repos), passed via `secrets: inherit`.
#
# ✅ POST-MERGE: `uses:` and `e2e_ref` point at the hub `@main` (engine merged via b27a874, 2026-06-29 —
#    config/suite + journey engine + report-to-Storage now live on main). Triggers on the sudo branches
#    [cicd-dev, cicd-prod] like queue; switch to [development] at the joint cutover.
name: journey-e2e (emulator gate)

on:
  pull_request:
    branches: [cicd-dev, cicd-prod]   # sudo branches — match queue. Switch to [development] at cutover.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/app/Journey Onboarding/**'
      - 'src/app/journey-onboarding-detail/**'
      - 'src/app/**.guard.ts'
      - 'angular.json'
      - 'package.json'
      - '.github/workflows/journey-e2e.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Spec subset (space-separated). Empty = all journey specs.'
        type: string
        default: ''
      evidence:
        description: '1 = capture screenshots + traces (to debug a CI-only failure)'
        type: string
        default: '0'

jobs:
  gate:
    # Cost control: skip the heavy gate on DRAFT PRs unless explicitly labeled `run-e2e`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    uses: School-of-Excellence/starlabs-e2e-tests/.github/workflows/web-e2e.yml@main
    with:
      cf_branch: development
      e2e_ref: main                                  # engine landed on main (hub merge b27a874); was journey-reusable during validation
      firebase_project: starlabs-cicd                # MUST match the app's projectId or auth silently fails (SETUP §3)
      config: playwright.journey.emulator.evidence.config.ts  # EVIDENCE variant: screenshot+trace per test → browsable report for Firestore/Storage capture
      suite: journey                                 # default spec root (find journey/) + history audit tag
      only: ${{ (github.event_name == 'workflow_dispatch' && inputs.only) || '' }}
      evidence: ${{ (github.event_name == 'workflow_dispatch' && inputs.evidence) || '1' }}  # default 1: blob+merge a screenshot-per-test report that record-run.cjs ships to Storage + Firestore cicd-audit
    secrets: inherit
