# journey-e2e — the hermetic Playwright gate for the JOURNEY & PRODUCTS system (Starlabs 19).
#
# WHAT IT DOES
#   On a PR to `development` that touches journey screens, this assembles a single CI workspace from THREE
#   repos and runs the journey e2e suite against the REAL Cloud-Function triggers in the Firebase emulator:
#     • starlabs-angular        (this repo — the app under test)              checked out at the root
#     • starlabs-e2e-tests      (the Playwright engine + ci/overlay)          cloned into ./e2e
#     • starlabs-cloud-function (the real Firestore triggers)                 cloned into ./e2e/starlabs-cloud-function
#   Then e2e/ci/setup-emulator-config.sh OVERLAYS the emulator wiring onto the app, boots the emulator + CF,
#   serves the app emulator-wired on :4200, and runs playwright.journey.emulator.config.ts.
#
#   This mirrors queue-e2e.yml, with three corrections proven by the local green run (16/16):
#     1. FIREBASE_PROJECT = starlabs-cicd everywhere (matches environment.emulator.ts; the project-id mismatch
#        is the #1 documented gotcha — a wrong id makes auth silently fail).
#     2. The CF repo is cloned INTO ./e2e/starlabs-cloud-function (the hub-rooted deploy script resolves it there).
#     3. setup-emulator-config.sh is run WITH APP_PATH set (otherwise it defaults to the non-existent ./e2e/app).
#
#   Stage-2 gate: runs AUTOMATICALLY on the PR (pre-merge); a human still merges. Report-only until observed-
#   green on a real PR, then make it a required check.
#
# ── ONE SECRET REQUIRED ─────────────────────────────────────────────────────────────────────────────
#   REPO_PAT — a fine-grained PAT with READ access to BOTH private repos:
#              School-of-Excellence/starlabs-e2e-tests  AND  School-of-Excellence/starlabs-cloud-function
name: journey-e2e (emulator gate)

on:
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/app/Journey Onboarding/**'
      - 'src/app/journey-onboarding-detail/**'
      - 'src/app/**.guard.ts'
      - 'angular.json'
      - 'package.json'
      - '.github/workflows/journey-e2e.yml'
  workflow_dispatch: {}

# Cost control: skip the heavy gate on DRAFT PRs unless explicitly labeled `run-e2e`.
jobs:
  journey-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT: starlabs-cicd      # MUST match environment.emulator.ts (app + emulator + seed share this partition)
      CF_BRANCH: development                # the Cloud-Functions working branch
      CI: 'true'
    steps:
      - name: Checkout app (starlabs-angular)
        uses: actions/checkout@v4

      - name: Clone the E2E engine repo (starlabs-e2e-tests) → ./e2e
        uses: actions/checkout@v4
        with:
          repository: School-of-Excellence/starlabs-e2e-tests
          ref: journey-gate   # TEMPORARY: validate against the unmerged hub branch. Flip back to `main` after the hub PR merges.
          path: e2e
          token: ${{ secrets.REPO_PAT }}

      - name: Clone the Cloud Functions repo (real triggers) → ./e2e/starlabs-cloud-function
        run: |
          if [ -z "${{ secrets.REPO_PAT }}" ]; then
            echo "::error::REPO_PAT secret is not set — needed to clone the private CF repo."; exit 1
          fi
          git clone --depth 1 --branch "$CF_BRANCH" \
            "https://x-access-token:${{ secrets.REPO_PAT }}@github.com/School-of-Excellence/starlabs-cloud-function.git" \
            e2e/starlabs-cloud-function

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # functions/package.json engines.node == 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # the Firestore/Auth emulators require a JRE

      - name: Overlay emulator config from the e2e repo onto the app
        run: APP_PATH="$GITHUB_WORKSPACE" bash e2e/ci/setup-emulator-config.sh

      - name: Install firebase-tools
        run: npm i -g firebase-tools@latest

      - name: Install app deps
        run: npm ci --legacy-peer-deps

      - name: Install Cloud Functions deps
        run: cd e2e/starlabs-cloud-function/functions && npm ci

      - name: Install e2e deps
        run: cd e2e && npm ci

      - name: Install Playwright chromium
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Boot Firebase emulator + Cloud Functions
        run: |
          cd e2e && nohup bash scripts/deploy-cf-emulator.sh > /tmp/emu.log 2>&1 &
          for i in $(seq 1 90); do grep -q "All emulators ready" /tmp/emu.log && break; sleep 2; done
          if ! grep -q "All emulators ready" /tmp/emu.log; then echo "::error::emulator failed to boot"; cat /tmp/emu.log; exit 1; fi
          grep -E "functions: Loaded|All emulators ready" /tmp/emu.log

      - name: Boot emulator-wired Angular app
        run: |
          nohup npm run start:emulator > /tmp/app.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://localhost:4200 >/dev/null 2>&1 && break; sleep 3; done
          if ! curl -sf http://localhost:4200 >/dev/null 2>&1; then echo "::error::app failed to serve on :4200"; tail -60 /tmp/app.log; exit 1; fi

      - name: Run the journey e2e suite (the gate)
        run: cd e2e && EMU_REUSE=1 EMU_REUSE_APP=1 npx playwright test --config=playwright.journey.emulator.config.ts --retries 1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-playwright-report
          path: e2e/playwright-report
          retention-days: 14
